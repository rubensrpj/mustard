[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/dashboard/server",
    "apps/mcp",
    "apps/rt",
    "apps/scan",
    "packages/core",
]
# `apps/dashboard/server` was excluded while it was a desktop-shell wrapper: that
# wrapper pinned it to edition 2021 with its own Cargo.lock and a dependency set
# that could not consume `[workspace.dependencies]`. The shell is gone — the
# dashboard backend is now a plain `tiny_http` server — so the reason evaporated
# and the crate is a normal member: `cargo build --workspace` compiles it.
#
# Still excluded: the mustard-translate sidecar (apps/translate) — candle +
# lingua are heavy deps that must not bloat the hook (`mustard-rt`) or the
# deterministic scanner; it builds standalone, as its own workspace.
exclude = ["apps/translate"]

[workspace.package]
# The Mustard version, inherited by every workspace crate with
# `version.workspace = true`. It must equal `plugin/.claude-plugin/plugin.json`
# — the line `bump-on-main` advances on every merge to main and the release gate
# checks against the git tag. `tests/version_line.rs` in mustard-core fails the
# build if the two ever disagree.
#
# Why it must: a locally built binary has no `MUSTARD_RELEASE_VERSION`, so
# `platform::harness::harness_version` falls back HERE. This value therefore
# reaches `mustard-rt --version`, the statusline's `m{version}` mark and the
# `mustard.json#version` stamp every install writes into a project. Left behind,
# it does not read as "a dev build" — it reads as a real, old release, and the
# harness's own drift warning starts arguing with itself. That is exactly what
# happened while this sat at 0.1.0 through twenty-eight published releases.
version = "0.1.56"

# Single source of dependency-version truth for every Mustard crate. A crate
# opts in with `dep = { workspace = true }`. Versions verified against
# crates.io, May 2026 (see spec b2 § Stack Rust).
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"
# Interactive terminal prompts for the CLI port (`mustard init` git-flow wizard).
# Replaces the JS `inquirer` dependency. Pure-Rust, no async runtime.
dialoguer = "0.12"
# HTTP client for the CLI port — `add` (npm tarball download), `review` (Claude
# API), `auto-update` (npm registry). Blocking, no async runtime, matching the
# synchronous shape of the rest of the crate. Versions verified against
# crates.io, May 2026.
ureq = { version = "3.3", features = ["json"] }
# Tarball extraction for `mustard add` (npm package payloads ship as .tgz).
tar = "0.4.46"
flate2 = "1.1.9"
# Official Rust SDK for the Model Context Protocol — backs the `mcp` face of
# `mustard-rt` (the re-port of the `mustard-memory` TypeScript MCP server).
# The `server` feature already pulls `macros` (in `default`) and `schemars`;
# `transport-io` adds the stdio (JSON-RPC over stdin/stdout) transport.
#
# Moved 1.8 -> 3.1 (two majors) because 1.8 ANSWERS the `2026-07-28` protocol
# revision without serving it: driving a real stdio handshake against both
# builds, each replies `"protocolVersion":"2026-07-28"`, but 1.8 returns a bare
# `{"tools":[...]}` while 3.1 returns that revision's tool-list cache metadata
# (`resultType` / `ttlMs` / `cacheScope`). Advertising a revision we do not
# serve is the drift worth closing.
#
# The two majors cost two lines — `model::Content` became
# `model::content::ContentBlock`, and nothing else in `apps/mcp` moved. Crate
# count moved 281 -> 282 here (the 3.x line drops `async-trait` and adds `uuid`),
# and the pruning wave then took it to 278.
rmcp = { version = "3.1", features = ["server", "transport-io"] }
# Async runtime — required only by `rmcp` (async-only). Scoped to the `mcp`
# face: the handler builds a `current_thread` runtime locally so the `on` /
# `run` / `check` faces stay fully synchronous. Latest stable verified on
# crates.io (1.52, May 2026).
tokio = { version = "1.52.3", features = ["rt", "io-std", "macros"] }
# BPE tokenizer used by `core::economy::estimator` as a Claude-token
# approximation (cl100k_base ≈ Anthropic models within ~5%). Latest stable
# verified on crates.io (0.12.0, 2026-06); the 0.12 line made the low-level
# `CoreBPE::encode`/`count` fallible (`Result<_, EncodeError>`) — the
# estimator only calls `encode_with_special_tokens`, which stays infallible.
tiktoken-rs = "0.12"
# Cross-platform filesystem notification — the dashboard server's per-project
# `.claude/` watcher. Updated to notify 8.2 (May 2026). `mustard-rt` also
# declared this entry, for a transcript-watcher daemon that no longer exists;
# the declaration was removed in the prune, so the dashboard is now the sole
# consumer and the entry stays here only because that is where versions live.
notify = "8"
# Debounced wrapper over `notify` — the dashboard server coalesces a write burst
# into one ~200 ms batch before pushing it down the server-sent-events channel.
notify-debouncer-mini = "0.7"
# Minimal blocking HTTP server, no async runtime. Backs both the OTLP collector
# (`mustard-rt run otel-collector`) and the dashboard server. Kept at the same
# version `apps/rt` pins so the two share one graph.
tiny_http = "0.12"
# Home-directory resolution — the dashboard server locates `~/.claude/` for the
# project registry and for the Claude Code transcript store.
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Data-parallelism primitives — rayon parallelises the per-subproject
# verification pass (`verify_pipeline`) so targets are checked concurrently.
# Latest stable on crates.io (1.10, May 2026); pure-Rust, no async runtime.
rayon = "1.10"
# SHA-256 — `mustard-core::model::provenance` fingerprints vendored template
# trees. `mustard-rt` also declared this entry but never imported it (its
# backup-specs digest runs on the crate's own `util::sha256`), so the prune left
# `mustard-core` as the only consumer. Bumped to the 0.11 line (May 2026), which
# moves the digest output from `generic-array` to `hybrid-array`; this crate
# only consumes the output as a byte slice / iterator / `[u8; 32]`, all of which
# stay source-compatible.
sha2 = "0.11"

# Workspace-wide lints. A crate opts in with `[lints] workspace = true`.
#
# Every member opts in except `apps/scan`, which still carries no `[lints]`
# table. `mustard-dashboard` was the other holdout — the note here used to read
# "deliberately does not (its command surface predates the `unwrap_used = deny`
# rule)", which is how the workspace's NEWEST code came to be the only code the
# rule did not reach.
#
# `unwrap_used` below is `deny`, and clippy does NOT exempt `#[cfg(test)]` code
# from it on its own: `mustard-core`, `mustard-cli`, `mustard-rt` and
# `mustard-mcp` each open their crate root with
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used))]`, and THAT
# is what exempts their tests. `mustard-dashboard` deliberately carries no such
# line — see its `src/lib.rs` header.
[workspace.lints.rust]
# A hook on the critical path must never reach for `unsafe`.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pedantic is enabled to catch real bugs (filter_next, map_unwrap_or, manual_*
# anti-patterns, format_push_string, etc.). Per Clippy's own guidance, the
# group "contains opinionated lints ... users should expect to use allow
# attributes frequently" — so the explicitly-noisy/opinionated members are
# listed below as `allow`, while bug-catchers remain `warn`. Group has lower
# `priority` than overrides — Cargo rejects equal-priority ambiguity.
pedantic = { level = "warn", priority = -1 }

# Pedantic lints muted at workspace level — pure style/opinion, no bug value
# for a single-binary internal runtime (no public API surface).
#
# Documentation noise (no published API)
missing_errors_doc = "allow"      # internal hooks, no rustdoc consumers
missing_panics_doc = "allow"      # same
doc_markdown = "allow"            # demands backticks around every CamelCase
module_name_repetitions = "allow" # Clippy's own README example allows this
must_use_candidate = "allow"      # same
#
# Cast lints — flag any numeric cast. The codebase has many intentional
# `i64 <-> usize/u64` conversions for SQLite row counts, sizes, indices.
# Promoted to allow only after auditing: every cast in apps/rt is bounded
# (counts, file sizes, kb-scale offsets). If a real overflow risk surfaces,
# add `#[deny(...)]` at the call site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
#
# Function-shape opinions (no public API to police)
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"             # often intentional for trait dispatch
items_after_statements = "allow"  # late helper fns are clearer locally
#
# Naming opinions
similar_names = "allow"           # "store" vs "score" is not a bug
many_single_char_names = "allow"  # common in algorithm/parsing code
#
# Stylistic preferences (cosmetic, no bug catch)
if_not_else = "allow"
single_match_else = "allow"
match_same_arms = "allow"
default_trait_access = "allow"
bool_to_int_with_if = "allow"
ref_option = "allow"
needless_pass_by_value = "allow"  # sometimes required for trait obj / generics
redundant_closure_for_method_calls = "allow"
# W2 (claude-paths-single-source): the `ClaudePaths::for_project` fallback
# pattern `.map(|p| accessor()).unwrap_or_else(|_| legacy_join)` is more
# readable than `map_or_else(|_| legacy, |p| accessor())` because the
# success path is the dominant case and naturally sits first.
map_unwrap_or = "allow"
#
# File-extension comparisons — Mustard convention is lowercase-only extensions
# (`.md`, `.json`, `.rs`, `.toml`). A case-insensitive match would over-match
# files we intentionally ignore (e.g. screenshot `.PNG` from external tools).
case_sensitive_file_extension_comparisons = "allow"
#
# A `Result` that never errs is the SHAPE OF AN INTERFACE here, not a claim
# that this implementation can fail. Three places rely on it and all three
# would get worse if the wrapper were removed: (1) the dashboard's HTTP
# handlers, where `server.rs` maps every argument table onto a uniform
# `Result<T, String>` — one handler returning a bare `T` would need its own
# branch in the dispatcher; (2) ports whose OTHER implementations do fail, so
# the trait's signature is fixed elsewhere; (3) functions that document the
# reservation out loud, like `economy::sources::rtk::ingest_with` — "the only
# `Err` shape is reserved for future variants that need to escalate".
# Verified by reading all three before muting, not assumed.
unnecessary_wraps = "allow"
#
# Every instance is `&I18n` — a two-byte language tag. Clippy is right that
# passing it by value is marginally cheaper; it is also a change that touches
# every call site of the rendering layer to buy something no benchmark here
# could measure. Internal API, no published surface, nothing to police.
trivially_copy_pass_by_ref = "allow"

# `.unwrap()` panics — a panic in a hook breaks the fail-open contract. Deny
# it crate-wide. Clippy already exempts `#[cfg(test)]` code from this lint, so
# test modules may still use `.unwrap()`.
unwrap_used = "deny"

# The shipped binaries (`mustard-rt`, `scan`) run on every tool call and every
# scan. A tuned release profile shrinks the image the OS maps per hook spawn —
# the dominant per-invocation cost — for free. NOTE: `panic = "abort"` is
# deliberately NOT set — `ast/loader.rs::load_config` relies on `catch_unwind`
# to degrade when `tree-sitter-loader`'s `Config::initial()` panics on a
# missing home dir (containers/CI); aborting there would break the fail-open
# contract. `strip`+`lto`+`codegen-units` capture the size win without it.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Faster incremental link + smaller debug artifact for the dev loop. Line-table
# debuginfo keeps backtraces useful; optimizing deps (not our crates) cuts the
# cold-build tail without slowing our own recompiles.
[profile.dev]
debug = 1
# Incremental compilation is KEPT, and stated here rather than inherited, because
# the default carries no opinion about a directory that reached 52 GB on a real
# checkout. Measured before deciding (2026-08-14, Windows): a one-line rebuild of
# mustard-rt costs 8,6s with the cache and 29,7s without — it pays for itself 3,5×,
# so turning it off to reclaim disk would have made every edit three and a half
# times slower. The proposal to disable it was refuted by its own measurement.
#
# The price is real and bounded by nothing the toolchain offers: two rebuilds alone
# left 4,53 GB across 15 165 files in target/debug/incremental. There is no cargo
# knob that caps it, so the bound is operational — `cargo clean -p <crate>` for one
# crate, or deleting target/debug/incremental outright, which costs exactly one cold
# rebuild and nothing else. Full figures: docs/2026-08-14-build-cycle-measurements.md.
#
# CI declares the OPPOSITE (CARGO_INCREMENTAL: 0 in .github/workflows/ci.yml) and
# that is not a contradiction: a runner is discarded after one build, so it only
# ever pays the write.
incremental = true

[profile.dev.package."*"]
opt-level = 1
