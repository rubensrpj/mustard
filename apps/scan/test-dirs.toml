# Inline test markers — DATA embedded at compile time (include_str!), like
# generated-markers.toml: tuning the list is a data change, never a logic
# change in src/.
#
# A source file whose content carries one of these literals holds its own
# tests, so the map says the file covers itself. Read only by the test map
# (which tests cover each file).
#
# Which PATH is a test file is not declared here: that is the core's
# `is_test_path` (packages/core/src/domain/ast/conventions.rs), the single
# rule the whole scan reads.

inline_markers = [
  "#[cfg(test)]",
]
