# Language registry — the ONLY place a language is declared.
#
# grain's Rust source contains no language name, extension, or grammar node name.
# Everything language-specific lives here and under queries/<dir>/*.scm. To add a
# language:
#   1. add a [[language]] entry below;
#   2. drop tags.scm (+ optional supertypes.scm) under queries/<dir>/;
#   3. ONLY if the grammar crate is new: add it to Cargo.toml (aliased, e.g.
#      `grammar_kt = { package = "tree-sitter-kotlin", ... }`) and point `grammar`
#      at its LanguageFn constant.
# No change to grain's logic is ever required — build.rs reads this file and
# embeds the queries; the engine stays generic.
#
# O arquivo que responde pela pasta (o de entrada) vem da lista do núcleo,
# `packages/core/src/domain/ast/entry-files.toml`, pelo `name` daqui.
#
# Fields:
#   name          display id, stored on each module (e.g. shown in the JSON model)
#   extensions    file extensions that select this language (no leading dot)
#   dir           subdirectory under queries/ holding this language's .scm files
#   extra_queries OPTIONAL — mais uma pasta sob queries/, cujos .scm entram só
#                 na consulta desta entrada, depois dos de `dir`. Serve à
#                 entrada que divide o `dir` (e a família) com outra, mas cuja
#                 gramática tem nós que a outra não tem: o padrão com esses
#                 nós na pasta comum seria pulado na outra. A pasta precisa
#                 existir, ou a compilação para.
#   grammar       Rust expression yielding the grammar's tree-sitter LanguageFn;
#                 build.rs emits it verbatim, so the crate symbol never appears in src/.
#   root_aliases  OPTIONAL — leading import segments that alias the package root
#                 in qualified import paths. Only imports starting with one of
#                 these earn the graph's root-alias resolution probe; languages
#                 that declare none never take that branch, so a fully external
#                 import can never be mistaken for an internal module. O
#                 caminho de uma chamada qualificada (`@call.path`) só vira
#                 import do arquivo quando começa por um destes ou pelo
#                 `parent_alias`. O outro, de duas partes ou mais, fica com a
#                 chamada; quando a raiz dele não é peça do projeto, a
#                 chamada é da biblioteca e não liga ao projeto.
#   parent_alias  OPTIONAL — o nome que, no começo de um caminho qualificado,
#                 sobe um módulo (`super` em `super::x::f()`). O primeiro é a
#                 pasta de quem importa, e cada um a mais sobe uma pasta, como
#                 no import relativo; o arquivo que responde pela própria
#                 pasta (o de índice) já é o módulo dela, e sobe a partir da
#                 de cima. O resto do caminho é procurado nessa pasta, tirando
#                 do fim quantas partes for preciso até achar arquivo, porque
#                 o caminho pode terminar em tipo e método; sem arquivo para
#                 nenhuma parte, o alvo é o arquivo que responde pela pasta
#                 (`super::f()`). O que sobe além da raiz, ou não existe no
#                 projeto, não liga a nada. Dentro de N módulos escritos no
#                 próprio arquivo (`@inner_module`, o trecho de teste
#                 incluído), os N primeiros só saem deles e ficam no arquivo;
#                 os outros sobem pasta.
#   namespace_scope OPTIONAL — how a declared namespace is seen by the other files
#                 of the same language, with no import between them:
#                   "folder" the namespace holds only together with its folder
#                            (two folders declaring the same name are two);
#                   "nested" a file also sees every namespace above its own
#                            (a file in A.B sees A);
#                 without the field, a namespace is seen by the files that
#                 declare that same namespace, and nothing else.
#   doc_tags      OPTIONAL — the markup tags the language writes its documentation
#                 comments with. The engine drops them from the comment and keeps
#                 the text; a self-closing tag with a value leaves the value
#                 (`<see cref="Base"/>` reads `Base`). A `<...>` not named here
#                 stays as written. Without the field, the comment is kept as is.
#   import_extensions OPTIONAL — as extensões que o import da língua escreve no
#                 lugar da do próprio arquivo (o import cita `x.js` para o
#                 arquivo `x.ts`). O caminho importado só perde a última parte
#                 depois do ponto quando ela é uma de `extensions` ou uma
#                 destas; qualquer outro ponto é parte do nome
#                 (`./order.service` cita `order.service.<ext>`, nunca
#                 `order.<ext>`).
#   alias_config  OPTIONAL — o nome do arquivo de configuração que declara os
#                 apelidos de pasta dos imports da língua. O arquivo é JSON e
#                 aceita comentário e vírgula sobrando. Cada arquivo lê o mais
#                 próximo, subindo as pastas; o scan lê o projeto inteiro de
#                 novo sempre que um arquivo com esse nome muda. As três chaves
#                 abaixo apontam lugares dentro dele, em caminho com pontos:
#   alias_base    OPTIONAL — a pasta de onde se leem os imports não relativos,
#                 relativa à configuração que a declara;
#   alias_paths   OPTIONAL — o objeto que liga um padrão de import (no máximo
#                 um `*`) às pastas que ele representa, lidas a partir de
#                 `alias_base` quando existe, senão da configuração que o
#                 declara;
#   alias_extends OPTIONAL — o caminho, ou a lista deles, das configurações de
#                 que esta herda: a última da lista vence, e o próprio arquivo
#                 vence todas. Só se segue caminho relativo dentro do projeto;
#                 nome de pacote fica de fora.
#   relative_import OPTIONAL — o import relativo que a língua escreve com um
#                 separador no lugar da barra (`..core.models`). Uma chave:
#                   separator     o texto entre as partes do caminho. Repetido
#                                 no começo, ele faz o import relativo: um só
#                                 é a pasta de quem importa, e cada um a mais
#                                 sobe uma pasta; o resto, cortado nele, vira
#                                 o caminho dentro dela. Quando o import é só
#                                 esse começo, cada nome que ele traz
#                                 (`@imported` no mesmo pattern) é um arquivo
#                                 da pasta.
#                 O alvo é o arquivo da língua com esse caminho ou, sem ele, o
#                 arquivo de entrada da pasta, da lista do núcleo; o que não
#                 existe no projeto não liga a nada. O import que não começa
#                 pelo separador segue como os outros.
#   qualified_separators OPTIONAL — os textos que juntam as partes de um nome
#                 qualificado na língua (`crate::a::b`). Cada um vira `/` na
#                 forma única com que o grafo compara imports e namespaces,
#                 menos no texto que já é caminho (tem `/` ou começa por `.`)
#                 e, no import que termina na extensão da língua, menos na
#                 extensão. É também o que liga um nome ao qualificador
#                 escrito antes dele (`a` em `a::f()`). Sem o campo: `\` e
#                 `::` sempre viram `/`, o ponto só fora de caminho, e o
#                 qualificador é o nome antes de `::` ou de `.`.
#   member_separators OPTIONAL — os textos que ligam o método chamado ao
#                 valor escrito antes dele quando não juntam também as partes
#                 de um nome qualificado (`.` em `x.f()` numa língua cujo
#                 caminho usa `::`). O que vem antes deles é um valor, nunca
#                 um módulo: a chamada por ele só se prova quando o valor é o
#                 próprio objeto (`self_receivers`). Sem o campo, nenhum: o
#                 separador de nome qualificado já liga o método.
#   self_receivers OPTIONAL — os nomes que, escritos antes do método chamado,
#                 são o próprio objeto ou o próprio tipo (`self.f()`,
#                 `this.f()`): a chamada procura o método entre os membros do
#                 tipo em que ela está escrita. Sem o campo, nenhum nome é o
#                 próprio objeto.
#   parent_receivers OPTIONAL — os nomes que, escritos antes do método
#                 chamado, são o próprio objeto visto pelo tipo de cima
#                 (`base.f()`, `super.f()`). Como o próprio objeto, são do
#                 arquivo: a chamada por eles nunca é tomada por chamada de
#                 biblioteca. Sem o campo, nenhum.
#   package_entry OPTIONAL — os arquivos raiz de um pacote do repositório,
#                 sem a extensão e a partir da pasta do manifesto dele
#                 (`src/lib` no Rust). O caminho que nomeia um pacote do
#                 projeto e cujo resto não chega a arquivo nenhum
#                 (`demo_core::Leitor`) liga ao arquivo raiz, que declara o
#                 nome ou o repassa; e os módulos filhos do arquivo raiz moram
#                 na pasta dele, como os do arquivo que responde pela pasta.
#                 Sem o campo, nenhum: o caminho que não chega a arquivo não
#                 liga a nada.
#   implicit_self OPTIONAL — `true` na língua que chama um membro do próprio
#                 objeto pelo nome sozinho, sem escrever o objeto (`Fechar()`
#                 dentro da classe). Sem o campo, `false`: o nome sozinho
#                 nunca alcança um método, um campo ou um membro de enum, e o
#                 `Ok(` ou o `fechar()` escrito sem o objeto não liga a eles.
#   import_self   OPTIONAL — o nome que, trazido por um import (`@imported`),
#                 traz o último nome escrito antes da lista que o contém
#                 (`self` em `use std::fs::{self, File}` traz `fs`). Sem o
#                 campo, todo nome trazido é ele mesmo.
#   prelude       OPTIONAL — os nomes que todo arquivo da língua vê sem
#                 import (`Result`, `Option`). O nome escrito sozinho que está
#                 aqui só liga a uma declaração do projeto quando o arquivo o
#                 declara, o traz pelo nome num import ou importa com `*` o
#                 arquivo que o declara; senão é o da língua e não liga. Sem o
#                 campo, nenhum nome é da língua.
#   log_calls     OPTIONAL — as chamadas que escrevem no log (`console.log`,
#                 `println!`). O texto fixo (`@text`) escrito dentro de uma
#                 delas ganha a marca log. Cada entrada casa com o nome escrito
#                 antes do texto inteiro ou com o fim dele depois de um
#                 separador (`info!` casa com `tracing::info!`), e o `*` casa
#                 com qualquer nome (`console.*`). Vale o nome mais próximo do
#                 texto que casa com este campo ou com `error_forms`. Sem o
#                 campo, nenhum texto da língua é de log.
#   error_forms   OPTIONAL — o que lança ou devolve erro: a palavra que abre o
#                 comando (`throw`, `raise`) ou o nome escrito antes do texto
#                 (`Err`, `*Exception`), casados como em `log_calls`. O texto
#                 fixo escrito dentro de um deles ganha a marca erro. Sem o
#                 campo, nenhum texto da língua é de erro.

[[language]]
name = "csharp"
extensions = ["cs"]
dir = "csharp"
grammar = "grammar_cs::LANGUAGE"
namespace_scope = "nested"
self_receivers = ["this"]
parent_receivers = ["base"]
implicit_self = true
doc_tags = [
    "summary", "remarks", "returns", "param", "typeparam", "value", "example",
    "para", "c", "code", "list", "item", "term", "description", "exception",
    "see", "seealso", "paramref", "typeparamref", "inheritdoc", "include",
]
log_calls = ["LogError", "LogWarning", "LogInformation", "LogDebug", "LogTrace", "LogCritical", "Log", "Console.*", "Debug.*", "Trace.*"]
error_forms = ["throw", "*Exception"]

[[language]]
name = "typescript"
extensions = ["ts", "mts", "cts"]
dir = "typescript"
grammar = "grammar_ts::LANGUAGE_TYPESCRIPT"
self_receivers = ["this"]
parent_receivers = ["super"]
import_extensions = ["js", "mjs", "cjs", "jsx"]
alias_config = "tsconfig.json"
alias_base = "compilerOptions.baseUrl"
alias_paths = "compilerOptions.paths"
alias_extends = "extends"
log_calls = ["console.*", "logger.*", "Logger.*"]
error_forms = ["throw", "*Error", "*Exception", "reject"]

[[language]]
name = "tsx"
extensions = ["tsx"]
dir = "typescript"
extra_queries = "tsx"
grammar = "grammar_ts::LANGUAGE_TSX"
self_receivers = ["this"]
parent_receivers = ["super"]
import_extensions = ["js", "jsx", "mjs", "cjs"]
alias_config = "tsconfig.json"
alias_base = "compilerOptions.baseUrl"
alias_paths = "compilerOptions.paths"
alias_extends = "extends"
log_calls = ["console.*", "logger.*", "Logger.*"]
error_forms = ["throw", "*Error", "*Exception", "reject"]

# JavaScript: a gramática do TypeScript estende a do JavaScript, e a variante
# TSX lê também o JSX; as consultas são as do TypeScript e as do TSX.
[[language]]
name = "javascript"
extensions = ["js", "jsx", "mjs", "cjs"]
dir = "typescript"
extra_queries = "tsx"
grammar = "grammar_ts::LANGUAGE_TSX"
self_receivers = ["this"]
parent_receivers = ["super"]
log_calls = ["console.*", "logger.*", "Logger.*"]
error_forms = ["throw", "*Error", "*Exception", "reject"]

[[language]]
name = "python"
extensions = ["py", "pyi"]
dir = "python"
grammar = "grammar_py::LANGUAGE"
relative_import = { separator = "." }
self_receivers = ["self", "cls"]
log_calls = ["print", "logging.*", "logger.*", "log.*"]
error_forms = ["raise", "*Error", "*Exception"]

[[language]]
name = "rust"
extensions = ["rs"]
dir = "rust"
grammar = "grammar_rs::LANGUAGE"
root_aliases = ["crate", "self"]
parent_alias = "super"
qualified_separators = ["::"]
member_separators = ["."]
self_receivers = ["self", "Self"]
import_self = "self"
package_entry = ["src/lib", "src/main"]
prelude = ["Result", "Option", "Ok", "Err", "Some", "None", "Vec", "String", "Box"]
log_calls = ["println!", "eprintln!", "print!", "eprint!", "info!", "warn!", "error!", "debug!", "trace!", "log!"]
error_forms = ["Err", "panic!", "bail!", "anyhow!", "ensure!", "unreachable!", "unimplemented!", "todo!", "expect", "context", "with_context", "error"]

[[language]]
name = "go"
extensions = ["go"]
dir = "go"
grammar = "grammar_go::LANGUAGE"
namespace_scope = "folder"
log_calls = ["log.*", "fmt.Print*", "fmt.Fprint*", "slog.*"]
error_forms = ["errors.New", "fmt.Errorf", "panic", "Error"]

[[language]]
name = "php"
extensions = ["php"]
dir = "php"
grammar = "grammar_php::LANGUAGE_PHP"
member_separators = ["->"]
self_receivers = ["this", "self", "static"]
log_calls = ["error_log", "Log::*", "logger->*", "logger"]
error_forms = ["throw", "*Exception", "abort"]

[[language]]
name = "dart"
extensions = ["dart"]
dir = "dart"
grammar = "grammar_dart::LANGUAGE"
self_receivers = ["this"]
parent_receivers = ["super"]
implicit_self = true
log_calls = ["print", "debugPrint", "log", "logger.*"]
error_forms = ["throw", "*Exception", "*Error"]
