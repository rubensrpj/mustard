# As rotas do Fastify. O nome deste arquivo é o nome do framework; a consulta
# que acha as rotas está em `fastify/routes.scm`, e o que cada captura dela
# diz, em `src/routes.rs`.
#
# A rota é o `f.get('/rapido/:id', ler)`, pelo nome do método, com as opções
# no meio ou sem elas (`f.get('/x', { schema }, ler)`); quem atende é o
# último argumento. O `f.route({ method: 'POST', url: '/x', handler: h })`
# dá uma rota por método escrito, em texto ou em lista. O
# `f.register(plugin, { prefix: '/api' })` soma o prefixo às rotas escritas
# na função `plugin`, no mesmo arquivo ou no arquivo de onde o nome vem; o
# nome que recebe o módulo inteiro — o import padrão e o que recebe o
# `require` — (`route.module`) leva o prefixo a todas as rotas do arquivo.
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `imports`: a regra só roda no arquivo que importa um destes nomes, ou um
#   caminho que começa por ele seguido de separador (`fastify/types`).
# - `methods`: o nome do método chamado e o método HTTP que ele diz; `"*"` é
#   qualquer método. O nome fora da tabela não faz rota. O método escrito
#   como texto (`route.method.text`) vale sem as aspas, em maiúsculas.
# - `param_prefixes`: o começo do pedaço de caminho que é parâmetro (`:id`).
# - `path_starts`: o começo que todo caminho de rota tem. O texto sem ele
#   (`cache.get('chave', padrao)`) é outra coisa, e não faz rota.

language = ["typescript", "tsx", "javascript"]
imports = ["fastify"]
param_prefixes = [":"]
path_starts = ["/", "*"]

[methods]
get = "GET"
post = "POST"
put = "PUT"
patch = "PATCH"
delete = "DELETE"
head = "HEAD"
options = "OPTIONS"
all = "*"
