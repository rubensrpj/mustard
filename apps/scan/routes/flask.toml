# As rotas do Flask. O nome deste arquivo é o nome do framework; a consulta
# que acha as rotas está em `flask/routes.scm`, e o que cada captura dela diz,
# em `src/routes.rs`. A rota é o decorador sobre a função, que é quem a
# atende: `@app.route("/aves/<int:id>", methods=["POST"])` dá uma rota por
# método escrito na lista, e, sem a lista, a do método padrão; o
# `@bp.get("/x")` diz o método pelo nome.
#
# O `Blueprint('pedidos', __name__, url_prefix='/pedidos')` faz um grupo com
# o prefixo; guardado num nome (`bp = Blueprint(…)`), ele vale para as rotas
# registradas nesse nome. O `app.register_blueprint(bp, url_prefix='/api')`
# monta o blueprint: o prefixo vale para as rotas dele, no mesmo arquivo ou
# no arquivo de onde o nome vem — o que o import traz
# (`from .pedidos import bp`) ou o que a ligação acha (`pedidos.bp`).
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `imports`: a regra só roda no arquivo que importa um destes nomes, ou um
#   caminho que começa por ele seguido de separador (`flask.views`); o
#   `flask_sqlalchemy` é outro nome.
# - `methods`: o nome do decorador e o método HTTP que ele diz. O nome fora
#   da tabela não faz rota. O método escrito como texto na lista `methods`
#   (`route.method.text`) vale sem as aspas, em maiúsculas.
# - `default_method`: o método da rota em que a consulta não captura método
#   nenhum (o `route` sem a lista `methods`). O caminho com método escrito
#   não ganha também o padrão.
# - `param_wrappers`: as marcas que abrem e fecham um parâmetro (`<id>`,
#   `<int:id>`).

language = ["python"]
imports = ["flask"]
default_method = "GET"
param_wrappers = [["<", ">"]]

[methods]
get = "GET"
post = "POST"
put = "PUT"
patch = "PATCH"
delete = "DELETE"
