# As chamadas da tela feitas com o dio, no Dart. O nome deste arquivo é o nome
# do framework; a consulta que acha as chamadas está em `dio/routes.scm`, e o
# que cada captura dela diz, em `src/routes.rs`.
#
# A chamada é a de um método de um cliente do arquivo: o feito com
# `Dio(BaseOptions(baseUrl: 'https://loja.com/api'))`, cuja base, sem o
# esquema e a máquina, vai na frente de todo caminho que ele chama; o feito
# com `Dio()`; e o declarado com o tipo (`final Dio _dio;`), sem base.
# O caminho escrito como texto somado a um valor (`'/pedidos/' + id`) é o
# texto com um parâmetro no fim, no lugar do valor.
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `imports`: a regra roda no arquivo que importa um destes nomes, ou um
#   caminho que começa por ele seguido de separador (`package:dio/dio.dart`).
# - `methods`: o nome do método chamado e o método HTTP que ele diz. O nome
#   fora da tabela não é chamada.
# - `param_prefixes`: o começo do pedaço de caminho que é parâmetro (`$id`).
# - `param_wrappers`: as marcas que abrem e fecham um parâmetro no caminho
#   (`${id}`).

language = ["dart"]
imports = ["package:dio"]
param_prefixes = ["$"]
param_wrappers = [["${", "}"]]

[methods]
get = "GET"
post = "POST"
put = "PUT"
patch = "PATCH"
delete = "DELETE"
head = "HEAD"
