# As rotas do Django. O nome deste arquivo é o nome do framework; a consulta
# que acha as rotas está em `django/routes.scm`, e o que cada captura dela
# diz, em `src/routes.rs`. A rota é cada `path('pedidos/<int:id>/', …)`,
# `re_path(r'^aves/(?P<id>\d+)/$', …)` ou `url()` escrito numa lista — a
# `urlpatterns`, outra guardada num nome ou a escrita dentro de um
# `include` —, sem método: vale qualquer um. Quem atende é o nome escrito no
# segundo argumento, o que vem depois do último ponto (`views.ler_pedido`),
# ou a classe da `PedidoView.as_view()`.
#
# O `include` soma o prefixo do caminho que o chama às rotas do que ele
# inclui:
# - `include('loja.urls')`: o arquivo que o texto nomeia, lido como import do
#   arquivo que o escreve (`route.target.module`); o prefixo vale para todas
#   as rotas de lá.
# - `include([path('pedidos/', views.ler)])`: a lista escrita ali mesmo
#   (`route.scope`).
# - `include(extra)`: a lista guardada no nome `extra` (`route.target`), a
#   deste arquivo ou, quando um import traz o nome
#   (`from .api import extra`), a do arquivo de onde ele vem.
# - `include((extra, 'loja'))`: a lista, escrita ali ou guardada num nome,
#   numa tupla com o nome do app; o prefixo é o mesmo. A tupla com o texto
#   do módulo (`include(('loja.urls', 'loja'))`) monta o arquivo dele.
# - `include(loja_urls)`, com `from loja import urls as loja_urls`: o nome
#   que o import traz como módulo monta o arquivo inteiro.
#
# Os prefixos se somam de fora para dentro: o include escrito dentro de
# outro (`path('api/', include([path('v1/', include('loja.urls'))]))`), na
# lista guardada no nome que outro include monta, ou no arquivo que outro
# include monta, leva também o prefixo de fora.
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `imports`: a regra só roda no arquivo que importa um destes nomes, ou um
#   caminho que começa por ele seguido de separador (`django.urls`).
# - `default_method`: o método da rota em que a consulta não captura método
#   nenhum; `"*"` é qualquer método. Sem tabela `methods`: nenhuma rota
#   escreve o método.
# - `param_wrappers`: as marcas que abrem e fecham um parâmetro (`<id>`,
#   `<int:id>`, o grupo com nome da expressão, `(?P<id>\d+)`).
# - `path_trims`: as marcas que saem das pontas do caminho escrito antes de
#   tudo (`^` e `$` da expressão do `re_path`).

language = ["python"]
imports = ["django"]
default_method = "*"
param_wrappers = [["<", ">"], ["(?P<", ")"]]
path_trims = ["^", "$"]
