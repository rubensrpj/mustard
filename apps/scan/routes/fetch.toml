# As chamadas da tela feitas com o `fetch`, a função que o navegador dá a todo
# arquivo, sem import. O nome deste arquivo é o nome do framework; a consulta
# que acha as chamadas está em `fetch/routes.scm`, e o que cada captura dela
# diz, em `src/routes.rs`. Só a chamada solta conta (`fetch('/api/pedidos')`):
# a de um método com o mesmo nome (`repo.fetch()`) é outra coisa. O método
# vem do `method` das opções (`{ method: 'POST' }`); sem ele, é GET.
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `global`: a regra roda em todo arquivo dessas línguas, sem import.
# - `methods`: o nome chamado e o método HTTP que ele diz quando as opções
#   não dizem outro.
# - `param_wrappers`: as marcas que abrem e fecham um parâmetro no caminho
#   (`${id}`).

language = ["typescript", "tsx", "javascript"]
global = true
param_wrappers = [["${", "}"]]

[methods]
fetch = "GET"
