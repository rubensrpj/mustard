# As rotas do gin. O nome deste arquivo é o nome do framework; a consulta que
# acha as rotas está em `gin/routes.scm`, e o que cada captura dela diz, em
# `src/routes.rs`. A rota é o `r.GET("/x", h)`, pelo nome do método; quem
# atende é o último argumento. O `g := r.Group("/api")` faz um grupo com o
# prefixo, guardado na variável: as rotas registradas nela, e os grupos feitos
# dela (`g.Group("/v1")`), somam o prefixo, também dentro do bloco `{ … }`
# que o gin usa para mostrar o grupo.
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `imports`: a regra só roda no arquivo que importa um destes nomes, ou um
#   caminho que começa por ele seguido de separador (`…/gin/binding`).
# - `methods`: o nome do método chamado e o método HTTP que ele diz; `"*"` é
#   qualquer método. O nome fora da tabela não faz rota.
# - `param_prefixes`: o começo do pedaço de caminho que é parâmetro (`:id`,
#   `*resto`).

language = ["go"]
imports = ["github.com/gin-gonic/gin"]
param_prefixes = [":", "*"]

[methods]
GET = "GET"
POST = "POST"
PUT = "PUT"
PATCH = "PATCH"
DELETE = "DELETE"
HEAD = "HEAD"
OPTIONS = "OPTIONS"
Any = "*"
