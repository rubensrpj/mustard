# As chamadas da tela feitas com o pacote `http` do Dart. O nome deste arquivo
# é o nome do framework — com a língua na frente, porque o nome do pacote
# sozinho é o do protocolo, que o motor escreve —; a consulta que acha as
# chamadas está em `dart-http/routes.scm`, e o que cada captura dela diz, em
# `src/routes.rs`.
#
# A chamada é a de um método do objeto que o import traz
# (`import 'package:http/http.dart' as http;` e
# `http.get(Uri.parse('https://loja.com/api/pedidos/$id'))`) ou de um cliente
# feito com ele (`final cliente = http.Client();`) ou declarado com o tipo
# (`final http.Client cliente;`). O endereço vem escrito ali, no
# `Uri.parse('…')` ou no segundo argumento do `Uri.https('máquina', '/caminho')`
# e do `Uri.http(…)`; ele vale sem o esquema e a máquina.
#
# Os campos:
# - `language`: as línguas do registro (`languages.toml`) cujos arquivos a
#   consulta lê. Ela precisa compilar na gramática de cada uma.
# - `imports`: a regra roda no arquivo que importa um destes nomes, ou um
#   caminho que começa por ele seguido de separador
#   (`package:http/http.dart`). O nome que o import traz é o objeto da
#   biblioteca.
# - `methods`: o nome do método chamado e o método HTTP que ele diz. O nome
#   fora da tabela não é chamada.
# - `param_prefixes`: o começo do pedaço de caminho que é parâmetro (`$id`).
# - `param_wrappers`: as marcas que abrem e fecham um parâmetro no caminho
#   (`${id}`).

language = ["dart"]
imports = ["package:http"]
param_prefixes = ["$"]
param_wrappers = [["${", "}"]]

[methods]
get = "GET"
read = "GET"
readBytes = "GET"
post = "POST"
put = "PUT"
patch = "PATCH"
delete = "DELETE"
head = "HEAD"
