[package]
name = "mustard-rt"
version.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Mustard enforcement runtime: a single binary that replaces the per-hook `node` processes — a dispatcher running enforcement modules behind the `mustard-core` Check/Observer contract."
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "mustard-rt"
path = "src/main.rs"
# The binary does NOT run the unit tests. `main.rs` declares the same seven
# modules `lib.rs` does (it consumes none of the library), so without this every
# `#[cfg(test)]` block under `src/` was compiled and executed TWICE — once per
# target. Measured 2026-08-14: `unittests src/lib.rs` ran 1968 tests in 150,8s
# and `unittests src/main.rs` ran 1973 of the same ones in 187,6s, out of 397,7s
# of total execution. The duplicate alone was 47% of local test time and the
# largest single piece of the CI's 729s Windows test step.
#
# The five tests that were genuinely the binary's own moved to `src/hook_output.rs`,
# a module the library declares too, so they still run — once, on the lib target.
# Figures: docs/2026-08-14-build-cycle-measurements.md.
test = false

[lib]
name = "mustard_rt"
path = "src/lib.rs"

# Dependency versions live in the workspace `[workspace.dependencies]` table
# (root Cargo.toml); each crate references them with `{ workspace = true }`.
[dependencies]
mustard-core = { path = "../../packages/core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

# A hora do sinal de vida de uma onda (`round::queue::silent_minutes`) e do
# processo Claude Code por trás dela: a mesma leitura de `rfc3339` que o
# núcleo já usa.
chrono = { workspace = true }

# The pull-request calls against Azure DevOps go over HTTP. `ureq` is the
# workspace's blocking, runtime-free HTTP client — the same one `mustard-cli`
# uses; no async runtime is pulled in.
ureq = { workspace = true }

# `tempfile` stages the scratch directories the work-unit and capability
# commands write into, and powers the parity tests.
tempfile = { workspace = true }

# `notify` and `sha2` were declared here and imported by nothing. The
# `transcript-watcher` daemon that justified `notify` is gone (the only surviving
# mention is a doc comment in `shared/events/writer_ndjson.rs` pointing at the
# dashboard's watcher, which keeps its own `notify`), and the `backup-specs`
# MANIFEST.json digest that justified `sha2` runs on this crate's own
# `util::sha256`. Both were removed rather than wired up: adding an import to
# keep a manifest line honest is the wrong direction.

# Regex engine for the `qa-run` `Expect:` evidence matcher: an AC may declare
# `Expect: `<regex>`` and qa-run matches it against the command's own output, so
# a green command that prints no expected evidence still fails. Declared inline
# (mirrors `apps/scan`, the workspace's other regex user) — not yet a workspace
# dependency; the `1` line is the one already resolved in Cargo.lock via scan.
regex = "1"

# No `[dev-dependencies]`: the tests use `tempfile`, which is a normal
# dependency above because the runtime needs it too.

# Inherit the workspace lint table (pedantic = warn, unwrap_used = deny,
# unsafe_code = forbid). See the root Cargo.toml `[workspace.lints]`.
[lints]
workspace = true
