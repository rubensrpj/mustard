# bump-on-main — versão automática da era plugin: CADA merge na main
# incrementa o PATCH do plugin (plugin/.claude-plugin/plugin.json), commita,
# tagueia vX.Y.Z e despacha o workflow Release NO REF DA TAG — lá dentro,
# `github.ref_type == 'tag'` satisfaz o gate do job `publish`, e a conferência
# "tag == plugin.json" passa por construção (o bump acabou de gravar ambos).
#
# Por que o despacho explícito (`gh workflow run`): a tag é empurrada com o
# GITHUB_TOKEN, e o GitHub NÃO dispara workflows a partir de pushes feitos com
# esse token (anti-recursão) — sem o despacho, a tag nasceria muda. O mesmo
# mecanismo garante que o commit de bump não re-dispara este workflow nem a CI;
# o guard por mensagem abaixo é cinto-e-suspensório para o caso de um humano
# empurrar um commit `chore(release):` manualmente.
#
# O selo vai para AS DUAS pernas. O bump nasce na main; o último passo o
# propaga para o `dev`. Sem isso o `dev` nunca aprende a própria versão
# publicada: fica N commits atrás para sempre (DOIS por release — o merge de
# promoção + este bump) e todo binário compilado dele sai carimbado com uma
# versão velha, fazendo o aviso de version-drift do harness resmungar sozinho.
# A propagação SETA o valor (não faz cherry-pick), então é idempotente e
# converge mesmo depois de divergência acumulada.
name: Bump on main

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-on-main
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O bump precisa de cargo para manter o Cargo.lock alinhado com a versão
      # (ver o passo abaixo). A imagem `ubuntu-latest` traz Rust, mas depender
      # do que vem pré-instalado numa imagem é como o release da v0.1.29 falhou:
      # por um pressuposto que ninguém tinha verificado. Mesma ação que a CI usa.
      - uses: dtolnay/rust-toolchain@stable

      - name: Bump PATCH do plugin.json, tag, despacho do Release e selo no dev
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=plugin/.claude-plugin/plugin.json
          cargo_toml=Cargo.toml
          pv=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -1)
          IFS=. read -r ma mi pa <<<"$pv"
          nv="$ma.$mi.$((pa+1))"
          echo "bump: $pv -> $nv"
          sed -i "s/\"version\": \"$pv\"/\"version\": \"$nv\"/" "$manifest"
          grep -q "\"version\": \"$nv\"" "$manifest"   # o sed realmente aplicou

          # O selo tem DUAS pernas e as duas precisam andar juntas. Um binário
          # compilado sem MUSTARD_RELEASE_VERSION — todo build local, todo
          # install.ps1, toda CI — resolve harness_version() para o
          # CARGO_PKG_VERSION, ou seja, o [workspace.package] version daqui. Esse
          # é o número que sai no `--version`, no `m{version}` da statusline e no
          # carimbo `mustard.json#version` de cada instalação. Bumpar só o
          # manifesto deixava o Cargo.toml em 0.1.0 por 28 releases: não lia como
          # "build de dev", lia como release velho, e o aviso de drift do próprio
          # harness discutia consigo mesmo. `tests/version_line.rs` reprova se as
          # duas divergirem — este passo é o que as mantém iguais na origem.
          sed -i "0,/^version = \"$pv\"$/s//version = \"$nv\"/" "$cargo_toml"
          grep -q "^version = \"$nv\"$" "$cargo_toml"   # o sed realmente aplicou

          # TERCEIRA perna: o Cargo.lock grava a versao de cada membro do
          # workspace, e o Release compila com `--locked`. Mover o Cargo.toml sem
          # o lock deixa os dois divergentes e TODO job de build morre com
          # "cannot update the lock file because --locked was passed" — foi
          # exatamente o que derrubou o release da v0.1.29 nos tres SOs.
          # `--workspace` limita a atualizacao aos membros locais, entao nenhuma
          # dependencia externa se move junto. Preferido a um `sed` no lock, que
          # nao distingue a nossa versao da de uma dependencia que por acaso
          # tenha o mesmo numero.
          cargo update --workspace
          # Ancorado no NOME do pacote. Um `grep -q '^version = "$nv"$'` solto e
          # satisfeito por QUALQUER dependencia de terceiros que por acaso esteja
          # nesse numero — medido: `tracing` em 0.1.44 com o repositorio tambem
          # em 0.1.44 —, entao a guarda passava sem o lock ter andado. E a mesma
          # confusao que o comentario acima diz evitar, so que na guarda.
          root_pin=$(awk '/^name = "mustard-core"$/{getline; print; exit}' Cargo.lock)
          [ "$root_pin" = "version = \"$nv\"" ]   # o lock realmente andou

          # QUARTA perna: o dashboard (apps/dashboard/src-tauri) e workspace root
          # PROPRIO de proposito, entao tem o SEU Cargo.lock e o `cargo update
          # --workspace` acima nao o alcanca. Ele ficou tres releases para tras sem
          # ninguem notar: a CI exclui o dashboard (bibliotecas de sistema por SO) e
          # o Release o compila por `tauri build` SEM `--locked`, entao o lock velho
          # e consertado na hora do build e o conserto e jogado fora em vez de
          # commitado. O `--workspace` aqui tambem e o que limita a atualizacao aos
          # pacotes locais: um `-p mustard-core` re-resolve o grafo inteiro e move
          # dependencias de terceiros junto (medido: rebaixou windows-sys, toml e
          # getrandom). `packages/core/tests/version_line.rs` reprova se este lock
          # ficar para tras.
          cargo update --workspace --manifest-path apps/dashboard/src-tauri/Cargo.toml
          # Confere TODO crate nosso fixado nesse lock, nao apenas um.
          # `version_line.rs` cobra todo pacote local dele exceto o proprio
          # dashboard — hoje `mustard-core` E `mustard-cli`. Conferir so um deixa
          # o outro atrasar em silencio, e o teste fica vermelho num commit que a
          # CI nao roda (anti-recursao do GITHUB_TOKEN), entao ninguem ve ate o
          # proximo PR.
          for c in mustard-core mustard-cli; do
            pin=$(awk -v c="$c" '$0 == "name = \"" c "\"" {getline; print; exit}' apps/dashboard/src-tauri/Cargo.lock)
            if [ -z "$pin" ]; then
              echo "::error::$c sumiu do lock do dashboard. Se a dependencia foi removida de proposito, tire-o desta lista E de packages/core/tests/version_line.rs" >&2
              exit 1
            fi
            [ "$pin" = "version = \"$nv\"" ]   # o lock do dashboard realmente andou
          done

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$manifest" "$cargo_toml" Cargo.lock apps/dashboard/src-tauri/Cargo.lock
          git commit -m "chore(release): v$nv — bump automático pós-merge na main"
          # Rebase ANTES da tag: se outro merge entrou no meio-tempo, o commit
          # de bump é reescrito e a tag precisa apontar para o sha final.
          git pull --rebase origin main
          git tag -a "v$nv" -m "Mustard v$nv"
          git push origin main "v$nv"

          gh workflow run release.yml --ref "v$nv"
          echo "Release despachado no ref v$nv"

          # --- Propagar o selo para o dev ---------------------------------
          # Por último de propósito: se esta parte falhar, o release já está
          # publicado e íntegro. SETAMOS o valor (não cherry-pick) para ser
          # idempotente e imune à divergência já acumulada — o dev converge
          # para $nv venha de onde vier.
          git fetch origin dev
          git checkout -B dev-sync "origin/dev"
          dv=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -1)
          cv=$(sed -n '0,/^version = "/s/^version = "\([^"]*\)".*/\1/p' "$cargo_toml" | head -1)
          # A TERCEIRA e a QUARTA pernas entram na DECISAO tambem, nao so no
          # bloco de trabalho. As outras podem ja estar em $nv com um dos locks
          # para tras — foi exatamente o estado em que este conserto encontrou o
          # repositorio, com o lock do dashboard atrasado. Sem estes testes o
          # bloco inteiro seria pulado e a perna atrasada nunca andaria, que e o
          # defeito de novo com outra roupa. A mensagem do `then` diz QUATRO, e
          # so e verdade se as quatro estiverem no `if`.
          root_pin=$(awk '/^name = "mustard-core"$/{getline; print; exit}' Cargo.lock)
          dash_pin=$(awk '/^name = "mustard-core"$/{getline; print; exit}' apps/dashboard/src-tauri/Cargo.lock)
          if [ "$dv" = "$nv" ] && [ "$cv" = "$nv" ] \
             && [ "$root_pin" = "version = \"$nv\"" ] \
             && [ "$dash_pin" = "version = \"$nv\"" ]; then
            echo "dev já está em v$nv nas quatro pernas — nada a propagar"
          else
            sed -i "s/\"version\": \"$dv\"/\"version\": \"$nv\"/" "$manifest"
            grep -q "\"version\": \"$nv\"" "$manifest"   # o sed realmente aplicou
            # Mesma razão da perna da main: sem isto o dev compila binários
            # carimbados com uma versão que não existe mais.
            sed -i "0,/^version = \"$cv\"$/s//version = \"$nv\"/" "$cargo_toml"
            grep -q "^version = \"$nv\"$" "$cargo_toml"  # o sed realmente aplicou
            # …e o lock junto, senão o `--locked` do Release reprova o dev pelo
            # mesmo motivo que reprovou a main.
            cargo update --workspace
            # Ancorado no nome do pacote, pela mesma razao da perna da main: um
            # `grep` solto casa com qualquer dependencia de terceiros que por
            # acaso esteja nesse numero.
            root_pin=$(awk '/^name = "mustard-core"$/{getline; print; exit}' Cargo.lock)
            [ "$root_pin" = "version = \"$nv\"" ]

            # QUARTA perna: o dashboard (apps/dashboard/src-tauri) e workspace root
            # PROPRIO de proposito, entao tem o SEU Cargo.lock e o `cargo update
            # --workspace` acima nao o alcanca. Ele ficou tres releases para tras sem
            # ninguem notar: a CI exclui o dashboard (bibliotecas de sistema por SO) e
            # o Release o compila por `tauri build` SEM `--locked`, entao o lock velho
            # e consertado na hora do build e o conserto e jogado fora em vez de
            # commitado. O `--workspace` aqui tambem e o que limita a atualizacao aos
            # pacotes locais: um `-p mustard-core` re-resolve o grafo inteiro e move
            # dependencias de terceiros junto (medido: rebaixou windows-sys, toml e
            # getrandom). `packages/core/tests/version_line.rs` reprova se este lock
            # ficar para tras.
            cargo update --workspace --manifest-path apps/dashboard/src-tauri/Cargo.toml
            # Todo crate nosso do lock, nao apenas um — ver a perna da main.
            for c in mustard-core mustard-cli; do
              pin=$(awk -v c="$c" '$0 == "name = \"" c "\"" {getline; print; exit}' apps/dashboard/src-tauri/Cargo.lock)
              if [ -z "$pin" ]; then
                echo "::error::$c sumiu do lock do dashboard. Se a dependencia foi removida de proposito, tire-o desta lista E de packages/core/tests/version_line.rs" >&2
                exit 1
              fi
              [ "$pin" = "version = \"$nv\"" ]   # o lock do dashboard realmente andou
            done
            git add "$manifest" "$cargo_toml" Cargo.lock apps/dashboard/src-tauri/Cargo.lock
            git commit -m "chore(release): v$nv — sincroniza o selo de versão no dev"
            if git push origin "dev-sync:dev"; then
              echo "dev sincronizado: $dv -> $nv"
            else
              # Corrida com um push humano no dev. Não falha o job: o release
              # já saiu, e o próximo bump re-sincroniza sozinho (SETA o valor).
              echo "::warning::não consegui propagar v$nv para o dev (corrida?); o próximo release re-sincroniza"
            fi
          fi
