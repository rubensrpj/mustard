name: CI

on:
  # The pull-request run is the only one that can still REFUSE something: it
  # runs before the merge. A run started by a push begins AFTER the merge that
  # pushed, so its verdict arrives over a tree that is already integrated
  # (measured on 2026-08-29: PR 237 merged at 06:26 while its own CI run was
  # still `in_progress`). The promotion PR (`dev` → `main`) is therefore the
  # run that tests the combined tree before it reaches `main`.
  pull_request:
    branches: [main, dev]
  # The push runs are here for another job: they are the ONLY runs that save
  # the compiled build (`save-if` on the cache step below). GitHub lets a run
  # restore a cache saved on its own branch, on the base branch of its pull
  # request, or on the default branch — nothing else. A cache saved inside a
  # pull request stays in that pull request, so the next one compiled from
  # zero. Saved by a push to `dev`, it is restored by every pull request aimed
  # at `dev`; saved on `main`, by the release too, since a tag run can only
  # reach the default branch. No other branch: a work branch would save a
  # cache nobody else can read.
  push:
    branches: [main, dev]
  # Manual runs (any branch) — lets a fix branch prove itself on all 3 OSes
  # before reaching main: Actions -> CI -> Run workflow. They restore the saved
  # build and save nothing.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Without a cap a hung step holds the runner for GitHub's six-hour default,
    # and a macOS test once did exactly that. The slowest job measured, the
    # Windows tests, took 16 minutes: half an hour stops a hang without cutting
    # a slow but healthy run.
    timeout-minutes: 30
    env:
      # A runner is discarded after every job, so incremental state is WRITTEN
      # and never read back — pure cost here. Declared rather than inherited,
      # because the default has no opinion and this one is measured: locally the
      # cache is worth keeping (a one-line rebuild is 8,6s with it against 29,7s
      # without), and that argument does not survive a machine that never gets a
      # second build. Same setting, opposite verdicts, for a stated reason —
      # see docs/2026-08-14-build-cycle-measurements.md §5.
      CARGO_INCREMENTAL: 0
    strategy:
      # One OS failing should not cancel the others — we want the full
      # cross-platform picture on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # NO version is named here, and that is the point: with the `toolchain`
      # input left empty this action installs exactly what `rust-toolchain.toml`
      # pins, components included. The previous action (`dtolnay/...@stable`)
      # could not read that file — it demanded a version of its own, so the
      # runner and every developer machine were free to drift apart with nothing
      # reporting it. A version written here would be that same second pin.
      #
      #   cache: false    — the explicit Swatinem step below is the one cache;
      #                     this action bundles the same one and would fight it.
      #   rustflags: ''   — the action otherwise exports `RUSTFLAGS=-D warnings`,
      #                     which promotes the workspace's warn-level pedantic
      #                     lints to errors and fails the build on style.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''

      # One cache for the whole workspace, saved ONLY by the push runs (the
      # `push` trigger above names `dev` and `main` and nothing else). Pull
      # requests and manual runs restore it and save nothing: what they saved
      # no other run could read, and it would push the shared cache out of the
      # repository's storage. The key is shared by name, not by job, so the
      # release jobs, which carry other job names, look up the same one.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mustard-workspace
          save-if: ${{ github.event_name == 'push' }}

      - name: Expose the scan binary to the tests that spawn it
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      # Search tests and installed gateways use this exact checked dependency.
      # Runners do not uniformly provide rg; never silently skip those tests.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified search dependency
        run: python packaging/fetch-ripgrep.py --dest target/debug

      # Scope to the logic crates (mustard-core / mustard-cli / mustard-rt).
      #
      # `-p scan` is here because mustard-rt's map tests run the scan compiled
      # with them: `Scan::locate()` looks for `scan` next to the test binary, and
      # the test that reads the projects table after a real scan
      # (`apps/rt/src/commands/scan.rs`) fails without it, asking for
      # `cargo build -p scan` — green on any dev machine that built it, red on a
      # bare runner. `cargo test` builds a package's BIN targets alongside its
      # tests, so `scan.exe` lands in target/debug before any test runs; the
      # PATH step above only has to name the directory, not wait for the file.
      #
      # There is no separate `cargo build` step any more. It compiled the same
      # four crates this line compiles, and the per-step attribution of run
      # 31796118965 priced that duplication at 306s on Windows alone
      # (docs/2026-08-14-build-cycle-measurements.md §7).
      #
      # `--test-threads=8` is DECLARED, not inherited. `cargo test` defaults to
      # one thread per core, which is right for work that computes and wrong for
      # work that WAITS: 155 of this suite's tests spend their time on spawned
      # `git` processes (`git_settle` alone is 28 tests at 1,74s each), so a
      # runner with 4 cores sits idle while git answers. Forcing the runner's own
      # shape on a 22-core machine and varying only the thread count:
      #
      #     4 threads → 65,4s     8 threads → 38,4s     12 → 46,0s     16 → 44,2s
      #
      # Doubling past the core count buys 41%; going further costs it back to
      # contention. 8 is the measured knee, not a round number.
      #
      # THAT CURVE IS LOCAL AND DOES NOT TRANSFER. Measured on the runner
      # itself (run 31821203556 against 31816628632, both cold-cache first runs):
      # the Test step went 792s → 738s, a real but modest −6,8%, not −41%. The
      # local run capped the TEST THREADS at 4 while the spawned `git` processes
      # still had 22 cores; on a 4-core runner they contend for the same 4, so
      # extra test threads mostly buy contention. Kept because 54s per Windows
      # round is free — but read 6,8% as the number, not 41%.
      # Full figures: docs/2026-08-14-build-cycle-measurements.md.
      #
      # `--no-fail-fast` is here because `cargo test` stops at the first test
      # FILE that fails: every file after it, in every crate, goes unrun. On a
      # pull request that read as a short list of failures per system while
      # whole files had never been tried there — each push of a fix showed the
      # next batch, one round trip per batch. With the flag the run tries every
      # file and lists every failure at once.
      - name: Test
        run: cargo test --locked --no-fail-fast -p mustard-core -p mustard-cli -p mustard-rt -p scan -- --test-threads=8

      # `-D warnings`: EVERY warning fails the build, not only the deny-level
      # ones. The lint table used to keep pedantic at warn "without drowning in
      # style noise", and the drowning happened anyway — 347 warnings, zero
      # errors, CI green. That count is not a cosmetic problem: with 347 in the
      # background a NEW warning becomes 348 and nobody sees it. Measured on
      # this very repository, 2026-08-27: two warnings introduced in one session
      # were found only by comparing counts against the previous commit, never
      # by reading the build.
      #
      # What normally makes `-D warnings` risky in CI is a compiler bump lighting
      # up new lints on a Friday afternoon. That does not apply here:
      # `rust-toolchain.toml` pins the compiler, so changing it is already a
      # deliberate commit that lands its own fallout.
      #
      # The escape hatch stays open and stays honest: a lint that is not worth
      # obeying is turned off in `[workspace.lints.clippy]` WITH the reason
      # written beside it, and `scripts/ac/lint-allows-have-reasons.py` fails the
      # build on a silent one.
      #
      # `--all-targets` is what makes the `unwrap_used = deny` rule reach the
      # test code: `.unwrap()` calls inside `#[cfg(test)]` modules and `tests/`
      # are never compiled by the default target set, so without this flag the
      # lint would report a pass nobody earned.
      #
      # O Clippy não roda no macOS. O lint compila o projeto inteiro mais uma
      # vez, em modo de verificação (medido no Linux: 50 s de parede e 151 s de
      # CPU, porque as dependências e os crates são verificados de novo), e o
      # veredito é o mesmo nos três sistemas, salvo no código atrás de `cfg`:
      # o Linux verifica o ramo dele e o Windows verifica o do Windows, onde
      # há mais de vinte pontos com `cfg(windows)` nos crates (o shell, a
      # morte de processo, o disparo separado). No macOS são três pontos com
      # `target_os = "macos"`, e ele é o que menos paga o passo. O limite de
      # tempo do job não sobe para caber a lentidão: a causa é que se corta.
      - name: Clippy
        if: runner.os != 'macOS'
        run: cargo clippy --locked --all-targets -p mustard-core -p mustard-cli -p mustard-rt -p scan -- -D warnings

      # A válvula de escape do passo acima é desligar o lint. Isto garante que
      # ela nunca seja usada em silêncio. É um script Python que lê arquivos:
      # o resultado é o mesmo nos três sistemas, e por isso roda só no Linux.
      - name: Lint allows carry a reason
        if: runner.os == 'Linux'
        run: python3 scripts/ac/lint-allows-have-reasons.py
