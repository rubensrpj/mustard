# As cópias separadas, a pasta do programa compilado da versão em construção
# e a cópia de segurança das skills que os testes criam nascem dentro de
# target/, nunca na pasta de cache de
# verdade do usuário. O caminho é relativo à raiz do
# repositório; uma variável já definida no ambiente continua valendo.
#
# A configuração do Claude Code que os testes leem também mora em target/,
# mesmo com a variável definida no ambiente: nenhum teste lê a pasta `.claude`
# de quem programa, como a procura do skill-creator faria.
#
# O git dos testes ignora a configuração do sistema: o `core.autocrlf` que o
# git do Windows traz nela troca o fim de linha dos arquivos que o teste
# compara, e o resultado passaria a depender da máquina. Nada é escrito em
# `.git/config`, e a identidade vem de cada teste.
#
# Os testes gravam sem esperar o disco confirmar: a pasta deles é apagada no
# fim, e a confirmação de cada gravação custa caro no servidor do Windows.
# O programa instalado nunca lê este arquivo e continua esperando.
#
# O git dos testes também não roda a limpeza automática (`maintenance.auto` e
# `gc.auto`): ela abriria mais um processo a cada commit de teste, e abrir o
# git custa 30 milissegundos no Windows. A configuração vai pelo ambiente, não
# pelo `.git/config`. Não ponha identidade aqui: esconderia no computador de
# quem programa a falta de identidade que o servidor mostra.
[env]
MUSTARD_COPIES_DIR = { value = "target/testes-copias", relative = true }
MUSTARD_BUILD_DIR = { value = "target/testes-build", relative = true }
MUSTARD_SKILLS_DIR = { value = "target/testes-skills", relative = true }
MUSTARD_SPEND_DIR = { value = "target/testes-gasto", relative = true, force = true }
CLAUDE_CONFIG_DIR = { value = "target/testes-claude", relative = true, force = true }
GIT_CONFIG_NOSYSTEM = "1"
MUSTARD_DISK_SYNC = "off"
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "maintenance.auto"
GIT_CONFIG_VALUE_0 = "false"
GIT_CONFIG_KEY_1 = "gc.auto"
GIT_CONFIG_VALUE_1 = "0"
