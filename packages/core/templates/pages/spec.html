<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>spec</title>
<style>
/* A página de uma spec do Mustard (mostarda e carvão): um template igual para
   toda spec, que lê o banco de dados da página e monta um painel. A leitura
   desce do geral ao detalhe, na largura inteira: o cabeçalho numa linha, o
   objetivo, quatro números, o que roda e o que espera agora, o gráfico das
   ondas com o detalhe da onda aberta e, por fim, o texto da spec em abas,
   com a busca acima delas. Cada coisa aparece uma vez só. */
:root{
  --paper:#FAFAF7;--surface:#FFFFFF;--ink:#2B2B29;--muted:#6B6A64;--rule:#E6E4DC;--rule-soft:#EFEDE6;
  --mustard:#E1AD01;--mustard-text:#8A6700;--mustard-soft:#FBF1CF;--mustard-line:#EFD27A;
  --ok-bar:#8FC4A1;--ok:#2F7A4B;--ok-soft:#E3F1E7;--no:#B3261E;--no-soft:#F8E3E1;--code:#F0EEE7;
  --sans:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#1C1C1A;--surface:#232321;--ink:#ECEAE3;--muted:#A7A59C;--rule:#363532;--rule-soft:#2C2B29;
  --mustard:#E8B923;--mustard-text:#F0C849;--mustard-soft:#352E17;--mustard-line:#6B5717;
  --ok-bar:#3F7A55;--ok:#7BC99A;--ok-soft:#1E3326;--no:#F2A097;--no-soft:#3A1F1C;--code:#2C2B28;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1C1C1A;--surface:#232321;--ink:#ECEAE3;--muted:#A7A59C;--rule:#363532;--rule-soft:#2C2B29;
  --mustard:#E8B923;--mustard-text:#F0C849;--mustard-soft:#352E17;--mustard-line:#6B5717;
  --ok-bar:#3F7A55;--ok:#7BC99A;--ok-soft:#1E3326;--no:#F2A097;--no-soft:#3A1F1C;--code:#2C2B28;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:var(--mustard-text);text-decoration-color:var(--mustard-line);text-underline-offset:2px}
p,ul,ol{margin:0 0 8px}
ul,ol{padding-left:22px}
li{margin-bottom:3px}
strong{font-weight:600}
code,pre{font-family:var(--mono);font-size:.86em}
code{background:var(--code);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
pre{background:var(--code);padding:12px 14px;overflow-x:auto;border-radius:10px;font-size:13px}
pre code{background:none;padding:0}
blockquote{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--mustard-line);color:var(--muted)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.page{max-width:1040px;margin-inline:auto;padding-inline:24px;padding-block:22px 64px;display:flex;flex-direction:column;gap:28px;min-width:0}
.board{display:flex;flex-direction:column;gap:28px;min-width:0}
.empty{margin:24px 0;padding:16px 18px;border:1px dashed var(--rule);border-radius:10px;color:var(--muted)}

/* Cabeçalho: nome, fase, branch e o botão numa linha só */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-width:0}
.head h1{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.phase{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);padding:6px 10px;border-radius:999px;background:var(--mustard-soft);color:var(--mustard-text)}
.phase::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mustard)}
.branch{font:13px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.head .tools{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--mustard-line)}
.goal{padding:12px 16px;border-left:3px solid var(--mustard);background:var(--surface);border-radius:0 10px 10px 0;min-width:0;overflow-wrap:anywhere}
.goal .prose p:last-child{margin-bottom:0}
.lbl{font:600 11px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

/* Números: quatro quadros, cada número dito uma vez */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
a.tile{color:inherit;text-decoration:none}
a.tile:hover{border-color:var(--mustard-line)}
.tile .k{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.tile .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.meter{height:5px;border-radius:3px;background:var(--rule-soft);overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--mustard)}

h2{margin:0;font-size:16px;letter-spacing:-.01em}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:10px}
.sec-head .muted{font-size:13px}

/* Agora: o que roda e o que espera, numa lista só */
.work{border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden}
.work details{border-top:1px solid var(--rule-soft)}
.work .grp{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px 8px;background:var(--paper);border-top:1px solid var(--rule-soft)}
.work .grp:first-child{border-top:0}
.work .grp+details{border-top:0}
.work summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 16px}
.work summary::-webkit-details-marker{display:none}
.work summary:hover{background:var(--paper)}
.pill{font:600 11px/1 var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:6px;white-space:nowrap;text-align:center;justify-self:start}
.pill.running{background:var(--mustard-soft);color:var(--mustard-text)}
.pill.wait{background:var(--rule-soft);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.fail{background:var(--no-soft);color:var(--no)}
.w-title{font-weight:500;min-width:0;overflow-wrap:anywhere}
.w-meta{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.w-body{padding:2px 16px 14px 122px;font-size:14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.w-body p{margin:0}
.w-body ol{margin:0}
.files{display:flex;flex-wrap:wrap;gap:4px}
.files code{font:12px var(--mono);background:var(--code);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}
.after{font-size:13px;color:var(--muted);padding:10px 16px;border-top:1px dashed var(--rule);background:var(--paper)}

/* Ondas: uma barra por onda, a altura é o gasto dela */
.chart-card{border:1px solid var(--rule);border-radius:12px;background:var(--surface);padding:14px 16px 12px;min-width:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:auto;height:200px}
.chart text{font:10px var(--mono);fill:var(--muted)}
.chart .grid{stroke:var(--rule-soft);stroke-width:1}
.chart rect.b{cursor:pointer}
.chart rect.b.done{fill:var(--ok-bar)}
.chart rect.b.done:hover{fill:var(--ok)}
.chart rect.b.fail{fill:var(--no)}
.chart rect.b.running{fill:none;stroke:var(--mustard);stroke-width:1.5;stroke-dasharray:3 2}
.chart rect.b.wait{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.chart rect.b.on{fill:var(--mustard);stroke:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.done{background:var(--ok-bar)}
.legend i.running{border:1.5px dashed var(--mustard)}
.legend i.fail{background:var(--no)}
.legend i.wait{border:1px dashed var(--muted)}
.legend i.on{background:var(--mustard)}
.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-soft);display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:14px;min-width:0}
.detail>*{grid-column:2;min-width:0;overflow-wrap:anywhere}
.detail .dn{grid-column:1;grid-row:1 / span 2;font:600 20px/1.2 var(--mono)}
.detail .dm{color:var(--muted);font-size:13px}
.detail ol{margin:0;padding-left:20px}
.detail ol li::marker{color:var(--muted);font:12px var(--mono)}

/* Os pedaços que abrem: o pedido da onda, o que ela entregou */
details.prompt{border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
details.prompt>summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--muted)}
details.prompt>.md{padding:0 14px 10px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.mh{font-weight:650;margin:12px 0 6px}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:4px 18px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.table{overflow-x:auto;max-width:100%;margin:0 0 4px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--rule)}
th{font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* Abas: o texto da spec, uma aba por vez, com a busca acima */
.search{display:block;width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px}
.search:focus{outline:none;border-color:var(--mustard-line)}
.find{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;margin-bottom:-1px;font-size:14px;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mustard);font-weight:600}
.tab i{font:normal 11px var(--mono);color:var(--muted);margin-left:5px}
.panel{display:flex;flex-direction:column;gap:8px;min-width:0}
details.item{background:var(--surface);border:1px solid var(--rule-soft);border-radius:10px;min-width:0}
details.item[open]{border-color:var(--rule)}
details.item>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:12px 16px;min-width:0}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary:hover .t{color:var(--mustard-text)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.c{font:12px var(--mono);color:var(--muted);background:none;padding:0}
.tag{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:5px;background:var(--rule-soft);color:var(--muted);white-space:nowrap}
.tag.mark,.tag.extra{background:var(--mustard-soft);color:var(--mustard-text)}
.when{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.top .pill{margin-left:auto}
.top .pill+.when{margin-left:0}
h3.t{margin:0;font-weight:500;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
details.item.old .t{color:var(--muted)}
.body{padding:10px 16px 14px;border-top:1px solid var(--rule-soft);font-size:14px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-wrap:anywhere}
.body>.prose p:last-child{margin-bottom:0}
.runs,.answer{display:flex;flex-direction:column;gap:6px}
.more{margin:4px 0 0;font-size:13px}
.more button,.link{background:none;border:0;color:var(--mustard-text);cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--mustard-line);text-underline-offset:2px}

@media (max-width:820px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .page{padding-inline:12px}
  .head .tools{margin-left:0}
  .work summary{grid-template-columns:auto minmax(0,1fr)}
  .w-meta{grid-column:1 / -1;text-align:left;white-space:normal}
  .w-body{padding-left:16px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tab{white-space:nowrap}
  .tile .v{font-size:24px}
  dl.kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="mustard-catalog">{}</script>
<script id="mustard-page">
// O script da página da spec. Ele lê o banco de dados que o claude.ai guarda
// junto da página (os itens copiados do spec.ndjson e o documento das coisas
// calculadas), monta o painel e se atualiza sozinho quando uma cópia nova
// chega. Os textos, os tipos de evento e as fases vêm do catálogo que o
// binário põe na tag mustard-catalog, no idioma do projeto. Sem banco, ou com
// o banco vazio, a página diz que ainda não há dados.
(function () {
  'use strict';
  var W = window, D = document;
  var CAT = {};
  try { CAT = JSON.parse(D.getElementById('mustard-catalog').textContent || '{}'); } catch (_) { CAT = {}; }
  var L = CAT.labels || {};
  function t(key) { return Object.prototype.hasOwnProperty.call(L, key) ? L[key] : key; }
  function say(key, vars) {
    var s = t(key);
    Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(String(vars[k])); });
    return s;
  }
  var DBP = CAT.db || { ranges: 'ranges', computed: 'computed/current' };
  var TYPES = {}, TYPE_LIST = CAT.types || [];
  TYPE_LIST.forEach(function (ty) { TYPES[ty.name] = ty; });
  var BLOCKS = CAT.blocks || [], PHASES = CAT.phases || [], APPROVED = CAT.approvedPhases || [];
  var FINDING = CAT.findingLabels || [];
  var MARK = typeof CAT.purgedMark === 'string' ? CAT.purgedMark : '';
  var PAGE = 500;
  if (CAT.lang) D.documentElement.setAttribute('lang', CAT.lang);

  // As regras de mostrar cada campo, as mesmas da página que o binário montava.
  var EXECUTION = ['criterion_run', 'send', 'delivered'];
  var EVENT_REF = ['reply_to', 'closes', 'criterion'];
  var EVENT_REFS = ['criteria', 'covers', 'items', 'result', 'targets', 'contracts'];
  var WAVE_NUMBERS = ['wave', 'waves', 'depends_on'];
  var LITERAL = ['sha', 'proof', 'command', 'hook', 'tool', 'mustard', 'branch', 'base', 'repo', 'skill', 'name'];
  var MARKED = ['agreed', 'specification', 'criteria', 'waves', 'notes'];
  var SUBJECTS = [['task', 'tasks', 'page.findings.tasks'], ['wave', 'waves', 'page.findings.waves'],
    ['criterion', 'criteria', 'page.findings.criteria'], ['rule', 'rules', 'page.findings.rules'],
    ['decision', 'decisions', 'page.findings.decisions'], ['skill', 'skills', 'page.findings.skills'],
    ['', 'others', 'page.findings.others']];
  var WAVE_STATES = ['todo', 'running', 'delivered', 'approved', 'rejected'];
  var DONE = ['approved', 'delivered'], OPEN = ['running', 'todo', 'rejected'];
  var PAGE_CARDS = 40;
  var CODE_RE = /(^|[^A-Za-z0-9_])(MSTD-[A-Z]+-\d{4,})(?![A-Za-z0-9_])/g;

  // ---------------------------------------------------------------------
  // Pequenas leituras
  // ---------------------------------------------------------------------
  function isInt(v) { return typeof v === 'number' && Number.isInteger(v) && v >= 0; }
  function str(v) { return typeof v === 'string' ? v : null; }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function ints(v) { return arr(v).filter(isInt); }
  function has(o, k) { return o !== null && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k); }
  function get(o, k) { return has(o, k) ? o[k] : undefined; }
  function oneLine(s) { return String(s).split(/\s+/).filter(Boolean).join(' '); }
  function join(list) { return list.join(', '); }
  function codeSpan(text) {
    var s = oneLine(text);
    var longest = s.split(/[^`]/).reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    var fence = new Array(longest + 2).join('`');
    return longest === 0 ? fence + s + fence : fence + ' ' + s + ' ' + fence;
  }
  function firstParagraph(text) {
    var line = oneLine(text.trim().split('\n\n')[0] || '').replace(/^#+/, '').replace(/^\s+/, '');
    return line.indexOf('- ') === 0 || line.indexOf('* ') === 0 ? line.slice(2) : line;
  }
  // O título de uma tarefa: o campo title, quando ela o tem; sem ele, a
  // primeira frase do texto, cortada em TITLE_CUT caracteres.
  var TITLE_CUT = 90;
  function taskTitle(e) {
    var own = oneLine(str(e.title) || '');
    if (own) return own;
    var text = firstParagraph(str(e.text) || '');
    var m = /^.*?[.!?](?=\s|$)/.exec(text);
    var chars = Array.from(m ? m[0] : text);
    return chars.length > TITLE_CUT ? chars.slice(0, TITLE_CUT - 1).join('').replace(/\s+$/, '') + '…' : chars.join('');
  }
  function when(e) { var at = str(e.at) || ''; return at ? at.slice(0, 16).replace('T', ' ') : null; }
  function countLines(text) { return text === '' ? 0 : text.replace(/\r?\n$/, '').split(/\r?\n/).length; }
  function fold(s) { return String(s).normalize('NFD').replace(/\p{M}/gu, '').toLowerCase(); }
  function waveOf(e) {
    if (e.type === 'wave') return isInt(e.n) ? e.n : null;
    if (['task', 'send', 'delivered', 'verdict', 'step'].indexOf(e.type) >= 0) return isInt(e.wave) ? e.wave : null;
    return null;
  }
  function blockOf(e) { return TYPES[e.type] ? TYPES[e.type].block : null; }
  function replacedBy(e) { return isInt(e.replaces) ? [e.replaces] : ints(e.replaces); }
  function seconds(from, to) {
    var a = Date.parse(from), b = Date.parse(to);
    return isNaN(a) || isNaN(b) ? null : Math.max(0, Math.floor((b - a) / 1000));
  }
  function duration(secs) {
    var m = Math.floor(secs / 60);
    if (m === 0) return '< 1 min';
    if (m < 60) return m + ' min';
    if (m < 1440) return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min';
    return Math.floor(m / 1440) + ' d ' + Math.floor(m % 1440 / 60) + ' h';
  }

  // ---------------------------------------------------------------------
  // A leitura dos itens: o que está à mostra, o código de cada um e a
  // aprovação que vale
  // ---------------------------------------------------------------------
  // Os números que uma remoção tira da leitura: os alvos dela e, com o
  // filtro, cada item do tipo e do intervalo gravado antes dela.
  function removeTargets(e, all) {
    var targets = ints(e.targets), f = e.filter;
    if (f && str(f.type) !== null && str(f.from) !== null && str(f.to) !== null) {
      all.forEach(function (o) { if (o.id < e.id && filterMatches(f, o)) targets.push(o.id); });
    }
    return targets;
  }
  // Os números que alguma remoção tira da leitura, cada um com a primeira
  // remoção que o aponta: o número dela e se ela devolve a versão anterior.
  // Só devolve a remoção gravada com a marca `gives_back`, que o binário põe
  // em toda remoção de hoje; a gravada antes da marca tira o item inteiro,
  // como tirava quando foi gravada.
  function removalsOf(all) {
    var removed = new Map();
    all.forEach(function (e) {
      if (e.type !== 'remove') return;
      var back = e.gives_back === true;
      removeTargets(e, all).forEach(function (id) { if (!removed.has(id)) removed.set(id, { by: e.id, back: back }); });
    });
    return removed;
  }
  // As substituições que valem, como pares [versão antiga, versão nova], do
  // mesmo jeito que o binário lê. A versão removida pela remoção de hoje não
  // substitui nada; a removida do meio da cadeia sai dela, e a versão
  // seguinte passa a substituir as que ela substituía. Seguem substituídas
  // pela versão removida a volta do agente já assumida, o que não tem tipo
  // conhecido e a versão tirada pela remoção de antes da marca.
  function replacementsOf(all, byId, removed) {
    function givesBack(id) {
      var r = removed.get(id);
      return !!r && r.back && byId.has(id) && has(TYPES, byId.get(id).type);
    }
    var pairs = [];
    all.forEach(function (e) {
      var pending = replacedBy(e), seen = new Set();
      if (givesBack(e.id)) {
        pending = pending.filter(function (old) { return byId.has(old) && byId.get(old).returned === true; });
      }
      while (pending.length) {
        var old = pending.pop();
        if (seen.has(old)) continue;
        seen.add(old);
        pairs.push([old, e.id]);
        if (givesBack(old)) pending = pending.concat(replacedBy(byId.get(old)));
      }
    });

  }
  // A busca procura em todos os itens das abas, sem diferença de acento nem
  // de maiúscula, ou pelo código de um item; o número de cada aba conta só o
  // que casa.
  function apply() {
    var terms = fold(q.value.trim()).split(/\s+/).filter(Boolean);
    var owners = null;
    if (terms.length === 1 && /[a-z]-\d/.test(terms[0])) {
      owners = CARDS.filter(function (x) { return x.code === terms[0] || x.code.slice(-terms[0].length - 1) === '-' + terms[0]; });
      if (!owners.length) owners = null;
    }
    PANELS.forEach(function (p) {
      var limit = SHOWN[p.anchor] || PAGE_CARDS, found = 0;
      p.cards.forEach(function (x) {
        var ok = !terms.length || (owners ? owners.indexOf(x) >= 0 : terms.every(function (w) { return x.text.indexOf(w) >= 0; }));
        x.el.hidden = !ok || found >= limit;
        if (ok) found++;
      });
      p.count.textContent = String(found);
      var rest = found - Math.min(found, limit);
      p.moreLine.hidden = rest <= 0;
      p.more.textContent = rest > 0 ? say('page.more', { n: Math.min(PAGE_CARDS, rest), rest: rest }) : '';
      p.empty.hidden = found > 0;
      p.empty.textContent = terms.length ? t('page.tab.no_match') : t('page.tab.empty');
    });
  }
  q.addEventListener('input', function () { SHOWN = {}; apply(); });

  // Um endereço da página: `#waves-N` abre o detalhe da onda N; o código de
  // um item abre o cartão dele, na aba dele, a linha dele em Agora ou a onda
  // em que ele está.
  function go(target) {
    var el = null;
    if (target === 'backlog' || target === 'now') el = D.getElementById(target);
    else {
      var at = LOC.get(target);
      if (!at) return false;
      if (at.kind === 'wave') { pick(at.n); el = DETAIL; }
      else if (at.kind === 'goal') el = at.el;
      else if (at.kind === 'row') { at.el.open = true; el = at.el; }
      else {
        var entry = at.entry;
        choose(entry.tab);
        if (entry.el.hidden) {
          q.value = '';
          var p = PANELS.filter(function (x) { return x.anchor === entry.tab; })[0];
          SHOWN[entry.tab] = Math.max(SHOWN[entry.tab] || PAGE_CARDS, p.cards.indexOf(entry) + 1);
          apply();
        }
        entry.el.open = true;
        el = entry.el;
      }
    }
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
    return true;
  }
  app.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (a && go(decodeURIComponent(a.getAttribute('href').slice(1)))) ev.preventDefault();
  });
  function hash() { return W.location && typeof W.location.hash === 'string' ? decodeURIComponent(W.location.hash.slice(1)) : ''; }
  if (W.addEventListener) W.addEventListener('hashchange', function () { go(hash()); });

  function render(model) {
    var open = new Set();
    CARDS.forEach(function (x) { if (x.el.open && x.el.getAttribute('id')) open.add(x.el.getAttribute('id')); });
    Array.prototype.forEach.call(board.childNodes || [], function (c) {
      if (c.getAttribute && c.getAttribute('id') === 'now') {
        (c.childNodes[1] ? c.childNodes[1].childNodes : []).forEach(function (r) { if (r.open && r.getAttribute('id')) open.add(r.getAttribute('id')); });
      }
    });
    KNOWN = model.known;
    MODEL = model;
    LOC = new Map();
    model.chart.forEach(function (w) { LOC.set('waves-' + w.n, { kind: 'wave', n: w.n }); });
    model.mdWaves.forEach(function (w, i) {
      w.body.forEach(function (node) { if (node.kind === 'item' && !LOC.has(node.code)) LOC.set(node.code, { kind: 'wave', n: model.chart[i].n }); });
    });
    D.title = model.title;
    nameEl.textContent = model.title;
    phaseEl.textContent = model.phase || '';
    phaseEl.hidden = !model.phase;
    branchEl.textContent = model.branch ? model.branch + (model.base ? ' → ' + model.base : '') : '';
    branchEl.hidden = !model.branch;
    board.textContent = '';
    if (model.goal) board.appendChild(renderGoal(model.goal));
    board.appendChild(renderTiles(model));
    board.appendChild(renderNow(model));
    board.appendChild(renderChart(model));
    renderTabs(model).forEach(function (el) { board.appendChild(el); });
    choose(CUR_TAB);
    apply();
    open.forEach(function (id) { var el = D.getElementById(id); if (el && el.tagName === 'DETAILS') el.open = true; });
    var keep = CUR_WAVE !== null && model.chart.some(function (w) { return w.n === CUR_WAVE; }) ? CUR_WAVE : firstWave(model);
    if (keep !== null) pick(keep);
    // No celular, o gráfico rola de lado dentro do próprio cartão e abre
    // mostrando as últimas ondas.
    var scroller = CHART;
    var toEnd = function () { if (scroller && typeof scroller.scrollWidth === 'number') scroller.scrollLeft = scroller.scrollWidth; };
    if (typeof W.requestAnimationFrame === 'function') W.requestAnimationFrame(toEnd); else setTimeout(toEnd, 0);
    statusEl.hidden = true;
    if (RENDERS === 0 && hash()) go(hash());
    RENDERS++;
    app.setAttribute('data-state', 'ready');
    app.setAttribute('data-renders', String(RENDERS));
  }
  function noData() {
    emptyState('empty', t('page.no_data'));
  }
  // O documento calculado já tem dado (uma cópia já rodou), mas nenhum item
  // veio da coleção de faixas: o modelo instalado está velho, lendo uma
  // coleção que a cópia de agora não usa mais — dizer isso vale mais do que
  // repetir a linha de banco vazio, que aqui seria falsa.
  function staleTemplate() {
    emptyState('stale', t('page.stale_template'));
  }
  function emptyState(state, message) {
    CARDS = []; PANELS = []; BARS = []; MODEL = null; LOC = new Map();
    board.textContent = '';
    statusEl.textContent = message;
    statusEl.hidden = false;
    RENDERS++;
    app.setAttribute('data-state', state);
    app.setAttribute('data-renders', String(RENDERS));
  }

  // O botão só aparece com o salvar arquivo do claude.ai (`downloads`)
  // disponível: sem ele, baixar direto pelo navegador não funciona dentro
  // do claude.ai, então o botão some em vez de tentar.
  var hasDownloads = W.claude && typeof W.claude.use === 'function' ? W.claude.use('downloads') : Promise.resolve(null);
  Promise.resolve(hasDownloads).then(function (dl) { download.hidden = !dl; }, function () { download.hidden = true; });
  download.addEventListener('click', function () {
    if (!MODEL) return Promise.resolve();
    var text = toMarkdown(MODEL), name = (MODEL.spec || 'spec') + '.md';
    var ask = W.claude && typeof W.claude.use === 'function' ? W.claude.use('downloads') : Promise.resolve(null);
    return Promise.resolve(ask).then(function (dl) {
      if (dl) return dl.save({ filename: name, data: text }).catch(function () { return null; });
      return null;
    }, function () { return null; });
  });

  // ---------------------------------------------------------------------
  // O banco: as faixas de itens em páginas, em ordem de início (e de
  // pedaço, dentro da mesma faixa), e o documento das coisas calculadas.
  // Uma cópia nova (uma faixa nova ou trocada, ou o documento das coisas
  // calculadas) faz a página ler de novo.
  // ---------------------------------------------------------------------
  var SEEN = { top: null, computed: null };
  // O primeiro pedaço de cada faixa (seq = início * 1000) leva `chunks`,
  // quantos pedaços ela tem agora. Um pedaço velho, que sobrou depois de a
  // faixa encolher (um expurgo, por exemplo), continua no banco sem ninguém
  // apagar; esta conta é por onde a leitura sabe até qual pedaço ler,
  // ignorando o que sobrou, sem repetir item.
  function readItems(db) {
    var out = [];
    var expect = {};
    function page(after) {
      return db.collection(DBP.ranges).where('seq', '>', after).orderBy('seq').limit(PAGE).get().then(function (snap) {
        var last = null;
        snap.docs.forEach(function (d) {
          var b = d.data();
          if (!b || !isInt(b.seq)) return;
          var start = Math.floor(b.seq / 1000);
          var n = b.seq - start * 1000;
          if (n === 0) expect[start] = isInt(b.chunks) ? b.chunks : 1;
          if (n < (expect[start] === undefined ? 1 : expect[start])) {
            (b.items || []).forEach(function (item) { out.push(item); });
          }
          last = b;
        });
        if (snap.docs.length < PAGE || !last || !isInt(last.seq) || last.seq <= after) return out;
        return page(last.seq);
      });
    }
    return page(-1);
  }
  function readComputed(db) {
    return db.doc(DBP.computed).get().then(function (s) { return (s && s.exists && s.data()) || {}; });
  }
  function reload(db) {
    return Promise.all([readItems(db), readComputed(db)]).then(function (got) {
      SEEN.computed = JSON.stringify(got[1]);
      if (!got[0].length) {
        SEEN.top = null;
        // Um documento calculado com dado é a marca de que uma cópia já
        // rodou; sem nenhum item na coleção de faixas mesmo assim, a coleção
        // que o modelo lê não é a que a cópia de agora escreve.
        var copied = got[1] && (isInt(got[1].last) || typeof got[1].spec === 'string');
        if (copied) staleTemplate(); else noData();
        return;
      }
      var model = build(got[0], got[1]);
      SEEN.top = model.top;
      render(model);
    }, function () { if (!MODEL) noData(); });
  }
  function watch(db) {
    var timer = 0;
    function later() { clearTimeout(timer); timer = setTimeout(function () { reload(db); }, 600); }
    function failed() { statusEl.textContent = t('page.watch_failed'); statusEl.hidden = false; }
    db.doc(DBP.computed).onSnapshot(function (s) {
      if (JSON.stringify((s && s.exists && s.data()) || {}) !== SEEN.computed) later();
    }, failed);
    db.collection(DBP.ranges).orderBy('seq', 'desc').limit(1).onSnapshot(function (s) {
      var d = s.docs[0], b = d && d.data();
      var items = (b && b.items) || [];
      var top = items.length ? items[items.length - 1] : null;
      if ((top && isInt(top.id) ? top.id : null) !== SEEN.top) later();
    }, failed);
  }
  var ready = W.claude && typeof W.claude.use === 'function' ? W.claude.use('db') : Promise.resolve(null);
  Promise.resolve(ready).then(function (db) {
    if (!db) { noData(); return; }
    return reload(db).then(function () { watch(db); });
  }, noData);
})();
</script>
</body>
</html>
