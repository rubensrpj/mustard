<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustard · spec</title>
<style>
/* A página de uma spec do Mustard (mostarda e carvão): um template igual para
   toda spec, que lê o banco de dados da página e monta as seções na tela.
   Menu lateral com as seções, barra com a busca, o filtro por tipo e o botão
   de baixar o .md, grupos recolhidos numa linha e cada item numa linha que
   abre para ler. */
:root{
  --paper:#FAFAF7;--surface:#FFFFFF;--ink:#2B2B29;--muted:#6B6A64;--rule:#E6E4DC;--rule-soft:#EFEDE6;
  --mustard:#E1AD01;--mustard-text:#8A6700;--mustard-soft:#FBF1CF;--mustard-line:#EFD27A;
  --code:#F0EEE7;--ok:#2F7A4B;--ok-soft:#E3F1E7;--no:#B3261E;--no-soft:#F8E3E1;--charcoal:#2E2E2B;
  --sans:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1C1C1A;--surface:#232321;--ink:#ECEAE3;--muted:#A7A59C;--rule:#363532;--rule-soft:#2C2B29;
  --mustard:#E8B923;--mustard-text:#F0C849;--mustard-soft:#352E17;--mustard-line:#6B5717;
  --code:#2C2B28;--ok:#7BC99A;--ok-soft:#1E3326;--no:#F2A097;--no-soft:#3A1F1C;--charcoal:#121211;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--mustard-text);text-decoration-color:var(--mustard-line);text-underline-offset:2px}
p,ul,ol{margin:0 0 10px}
ul,ol{padding-left:22px}
li{margin-bottom:4px}
li::marker{color:var(--mustard-text)}
strong{font-weight:600}
code,pre{font-family:var(--mono);font-size:.86em}
code{background:var(--code);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
pre{background:var(--code);padding:14px 16px;overflow-x:auto;border-radius:10px;font-size:13px}
pre code{background:none;padding:0}
blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--mustard-line);color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.muted{color:var(--muted)}
/* O menu lateral fica escondido por trás do conteúdo em qualquer largura, e só
   aparece por cima dele quando o botão de menu abre: assim o nome de uma
   seção nunca está no menu e no cabeçalho do conteúdo ao mesmo tempo. */
.shell{display:block;height:100vh}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule);
  position:fixed;z-index:10;inset:0 auto 0 0;width:min(300px,86vw);background:var(--paper);
  transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 9999px rgba(0,0,0,0)}
body.nav-open .side{transform:none;box-shadow:0 0 0 9999px rgba(0,0,0,.25)}
.brand{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;padding:22px 24px 18px}
.brand b{color:var(--mustard-text);font-weight:600}
.side nav{flex:1;min-height:0;overflow:auto;padding:0 12px 16px 14px}
ol.nav{list-style:none;margin:0;padding:0}
ol.nav li{margin:0 0 2px}
ol.nav a{display:flex;align-items:baseline;gap:8px;padding:5px 10px;border-radius:6px;font-weight:500;font-size:14px;color:var(--ink);text-decoration:none}
ol.nav a span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.nav a i{font:400 11px var(--mono);font-style:normal;color:var(--muted)}
ol.nav a:hover{color:var(--mustard-text);background:var(--mustard-soft)}
.tools{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--rule)}
.tools button,.btn{cursor:pointer;border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.tools button{flex:1}
.tools button:hover,.btn:hover{color:var(--ink);border-color:var(--mustard-line)}
.btn.main{background:var(--charcoal);color:#F3F1E9;border-color:var(--charcoal)}
#content{overflow:auto;height:100vh;min-width:0}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 40px;background:var(--paper);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.menu-btn{display:inline-flex}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{width:100%;height:36px;padding:0 90px 0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.search input:focus,select:focus{outline:none;border-color:var(--mustard);box-shadow:0 0 0 3px var(--mustard-soft)}
.hits{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px var(--mono);color:var(--muted);pointer-events:none}
select{height:36px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:0 8px;max-width:220px}
.page{max-width:1040px;padding:0 40px 40vh;margin:0 auto}
header.top{padding:34px 0 6px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mustard-text);margin:0 0 10px}
header.top h1{font-size:32px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin:0 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.meta li{margin:0}
.meta b{font:500 12.5px var(--mono);color:var(--ink)}
.empty{margin:40px 0;padding:18px 20px;border:1px dashed var(--rule);border-radius:10px;color:var(--muted)}
section.block{padding-top:44px}
section.block>h2{display:flex;align-items:baseline;gap:12px;font-size:22px;font-weight:650;letter-spacing:-.015em;line-height:1.25;margin:0 0 4px;padding:0 0 12px;border-bottom:1px solid var(--rule)}
.count{flex:none;margin-left:auto;font:400 12px var(--mono);color:var(--muted)}
.overview{margin:18px 0 8px}
.ov-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600;margin:0 0 10px}
.ov-head span{font-weight:400;color:var(--muted)}
.ov-spend{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.wgrid{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.wgrid li{margin:0}
.w{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none}
.w b{font:600 15px/1.2 var(--mono)}
.w span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w.ok span{color:var(--ok)}.w.no span{color:var(--no)}
.w.run{border-color:var(--mustard-line);background:var(--mustard-soft)}.w.run span{color:var(--mustard-text)}
.w.todo{border-style:dashed;background:transparent}
.w:hover{border-color:var(--mustard)}
details.group{border-bottom:1px solid var(--rule)}
details.group>summary{list-style:none;display:flex;align-items:center;gap:12px;min-width:0;padding:13px 4px;cursor:pointer}
details.group>summary::-webkit-details-marker,details.item>summary::-webkit-details-marker{display:none}
details.group>summary::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 0 2px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.group[open]>summary::before{transform:rotate(45deg) translate(-2px,-1px)}
.gt{flex:none;font-weight:600;font-size:15.5px}
.gs{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13.5px}
.gbody{padding:0 0 14px 20px}
.gbody>h3{font-size:14px;font-weight:600;margin:18px 0 8px}
details.item{border-top:1px solid var(--rule-soft)}
details.item>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:14px;padding:8px 10px;margin:0 -10px;border-radius:7px;cursor:pointer}
details.item>summary:hover{background:var(--surface)}
/* O título do item é um h3 (a hierarquia de página/seção/item pede um
   heading aqui), mas ele fica de fora do grid: o código e o texto do
   título continuam nas duas primeiras colunas, como antes. */
details.item>summary h3.sh{display:contents;font:inherit;margin:0}
.c{background:none;padding:0;font:500 12px var(--mono);color:var(--mustard-text);white-space:nowrap}
.t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.tail{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.tag{font:500 11.5px/1 var(--sans);padding:3px 8px;border-radius:999px;background:var(--code);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.no{background:var(--no-soft);color:var(--no)}
.tag.run,.tag.mark{background:var(--mustard-soft);color:var(--mustard-text)}
.tag.todo{background:transparent;border:1px dashed var(--rule)}.tag.done{color:var(--ink)}
.who,.when{font-size:12px;color:var(--muted)}.when{font-family:var(--mono)}
details.item.old .c,details.item.old .t{color:var(--muted)}
details.item[open]{margin:6px -12px 10px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
details.item[open]>summary{margin:0 -12px;padding:12px 12px 8px}
details.item[open]>summary .t{white-space:normal;font-weight:600}
.body{padding:0 0 14px;font-size:14.5px;min-width:0}
.prose{max-width:76ch}
.prose+.kv{margin-top:12px}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:5px 18px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
details.prompt{margin:4px 0 10px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
details.prompt>summary{cursor:pointer;padding:10px 14px;font-size:13.5px;color:var(--muted)}
details.prompt>.md{padding:0 16px 12px;font-size:14px}
.mh{font-weight:650;margin:14px 0 6px}
.table{overflow-x:auto;max-width:100%;margin:0 0 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 14px;border-bottom:1px solid var(--rule)}
th{font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
[hidden]{display:none!important}
@media (max-width:900px){
  .bar{padding:8px 16px}
  .page{padding:0 16px 40vh}
  details.item>summary{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  details.item>summary .c{grid-column:1/-1}
  .who{display:none}
  dl.kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="mustard-catalog">{}</script>
<script id="mustard-page">
// O script da página da spec. Ele lê o banco de dados que o claude.ai guarda
// junto da página (os itens copiados do spec.ndjson e o documento das coisas
// calculadas), monta as seções com as mesmas regras da página que o binário
// montava, mais a seção dos removidos no fim, e se atualiza sozinho quando uma
// cópia nova chega. Os textos, os
// tipos de evento e as fases vêm do catálogo que o binário põe na tag
// mustard-catalog, no idioma do projeto. Sem banco, ou com o banco vazio, a
// página diz que ainda não há dados.
(function () {
  'use strict';
  var W = window, D = document;
  var CAT = {};
  try { CAT = JSON.parse(D.getElementById('mustard-catalog').textContent || '{}'); } catch (_) { CAT = {}; }
  var L = CAT.labels || {};
  function t(key) { return Object.prototype.hasOwnProperty.call(L, key) ? L[key] : key; }
  function say(key, vars) {
    var s = t(key);
    Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(String(vars[k])); });
    return s;
  }
  var DBP = CAT.db || { ranges: 'ranges', computed: 'computed/current' };
  var TYPES = {}, TYPE_LIST = CAT.types || [];
  TYPE_LIST.forEach(function (ty) { TYPES[ty.name] = ty; });
  var BLOCKS = CAT.blocks || [], PHASES = CAT.phases || [], APPROVED = CAT.approvedPhases || [];
  var FINDING = CAT.findingLabels || [];
  var MARK = typeof CAT.purgedMark === 'string' ? CAT.purgedMark : '';
  var PAGE = 500;
  if (CAT.lang) D.documentElement.setAttribute('lang', CAT.lang);

  // As regras de mostrar cada campo, as mesmas da página que o binário montava.
  var EXECUTION = ['criterion_run', 'send', 'delivered'];
  var EVENT_REF = ['reply_to', 'closes', 'criterion'];
  var EVENT_REFS = ['criteria', 'covers', 'items', 'result', 'targets', 'contracts'];
  var WAVE_NUMBERS = ['wave', 'waves', 'depends_on'];
  var LITERAL = ['sha', 'proof', 'command', 'hook', 'tool', 'mustard', 'branch', 'base', 'repo', 'skill', 'name'];
  var MARKED = ['agreed', 'specification', 'criteria', 'waves', 'notes'];
  var SUBJECTS = [['task', 'tasks', 'page.findings.tasks'], ['wave', 'waves', 'page.findings.waves'],
    ['criterion', 'criteria', 'page.findings.criteria'], ['rule', 'rules', 'page.findings.rules'],
    ['decision', 'decisions', 'page.findings.decisions'], ['skill', 'skills', 'page.findings.skills'],
    ['', 'others', 'page.findings.others']];
  var STATES = {
    todo: ['page.value.wave_todo', 'page.value.wave_todo.many', 'todo'],
    running: ['page.value.wave_running', 'page.value.wave_running.many', 'run'],
    delivered: ['page.value.wave_delivered', 'page.value.wave_delivered.many', 'done'],
    approved: ['page.value.wave_approved', 'page.value.wave_approved.many', 'ok'],
    rejected: ['page.value.wave_rejected', 'page.value.wave_rejected.many', 'no']
  };
  var COLUMNS = ['page.metrics.col.wave', 'page.metrics.col.lines', 'page.metrics.col.chars', 'page.metrics.col.items',
    'page.metrics.col.delivery', 'page.metrics.col.rejected', 'page.metrics.col.last'];
  var CODE_RE = /(^|[^A-Za-z0-9_])(MSTD-[A-Z]+-\d{4,})(?![A-Za-z0-9_])/g;

  // ---------------------------------------------------------------------
  // Pequenas leituras
  // ---------------------------------------------------------------------
  function isInt(v) { return typeof v === 'number' && Number.isInteger(v) && v >= 0; }
  function str(v) { return typeof v === 'string' ? v : null; }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function ints(v) { return arr(v).filter(isInt); }
  function has(o, k) { return o !== null && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k); }
  function get(o, k) { return has(o, k) ? o[k] : undefined; }
  function oneLine(s) { return String(s).split(/\s+/).filter(Boolean).join(' '); }
  function join(list) { return list.join(', '); }
  function codeSpan(text) {
    var s = oneLine(text);
    var longest = s.split(/[^`]/).reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    var fence = new Array(longest + 2).join('`');
    return longest === 0 ? fence + s + fence : fence + ' ' + s + ' ' + fence;
  }
  function firstParagraph(text) {
    var line = oneLine(text.trim().split('\n\n')[0] || '').replace(/^#+/, '').replace(/^\s+/, '');
    return line.indexOf('- ') === 0 || line.indexOf('* ') === 0 ? line.slice(2) : line;
  }
  function when(e) { var at = str(e.at) || ''; return at ? at.slice(0, 16).replace('T', ' ') : null; }
  function countLines(text) { return text === '' ? 0 : text.replace(/\r?\n$/, '').split(/\r?\n/).length; }
  function fold(s) { return String(s).normalize('NFD').replace(/\p{M}/gu, '').toLowerCase(); }
  function waveOf(e) {
    if (e.type === 'wave') return isInt(e.n) ? e.n : null;
    if (['task', 'send', 'delivered', 'verdict'].indexOf(e.type) >= 0) return isInt(e.wave) ? e.wave : null;
    return null;
  }
  function blockOf(e) { return TYPES[e.type] ? TYPES[e.type].block : null; }
  function replacedBy(e) { return isInt(e.replaces) ? [e.replaces] : ints(e.replaces); }
  function seconds(from, to) {
    var a = Date.parse(from), b = Date.parse(to);
    return isNaN(a) || isNaN(b) ? null : Math.max(0, Math.floor((b - a) / 1000));
  }
  function duration(secs) {
    var m = Math.floor(secs / 60);
    if (m === 0) return '< 1 min';
    if (m < 60) return m + ' min';
    if (m < 1440) return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min';
    return Math.floor(m / 1440) + ' d ' + Math.floor(m % 1440 / 60) + ' h';
  }

  // ---------------------------------------------------------------------
  // A leitura dos itens: o que está à mostra, o código de cada um e a
  // aprovação que vale
  // ---------------------------------------------------------------------
  // Os números que uma remoção tira da leitura: os alvos dela e, com o
  // filtro, cada item do tipo e do intervalo gravado antes dela.
  function removeTargets(e, all) {
    var targets = ints(e.targets), f = e.filter;
    if (f && str(f.type) !== null && str(f.from) !== null && str(f.to) !== null) {
      all.forEach(function (o) { if (o.id < e.id && filterMatches(f, o)) targets.push(o.id); });
    }
    return targets;
  }
  function hiddenOf(all) {
    var hidden = new Map();
    all.forEach(function (e) {
      if (isInt(e.purged)) hidden.set(e.id, 'purged');
      if (e.type === 'remove') {
        removeTargets(e, all).forEach(function (id) { if (!hidden.has(id)) hidden.set(id, 'removed'); });
      }
      replacedBy(e).forEach(function (old) { if (!hidden.has(old)) hidden.set(old, 'replaced'); });
    });
    return hidden;
  }
  // O que saiu da spec, pelo número de cada item: o item que uma remoção
  // tirou da leitura e o item de que um expurgo tirou um trecho, cada um com
  // o registro que o tirou. O expurgo vence a remoção, porque o texto do item
  // expurgado nunca aparece; a linha que o formato antigo do expurgo
  // esvaziou aponta o expurgo pelo campo `purged`.
  function takenOutOf(all, byId) {
    var out = new Map();
    all.forEach(function (e) {
      if (isInt(e.purged)) out.set(e.id, { by: byId.get(e.purged) || null, purged: true });
      if (e.type === 'remove') {
        removeTargets(e, all).forEach(function (id) { if (!out.has(id)) out.set(id, { by: e, purged: false }); });
      }
      if (e.type === 'purge') ints(e.targets).forEach(function (id) { out.set(id, { by: e, purged: true }); });
    });
    return out;
  }
  function filterMatches(f, e) {
    if (e.type !== f.type) return false;
    var local = (str(e.at) || '').slice(0, 19), from = f.from.slice(0, 19), to = f.to.slice(0, 19);
    return local.slice(0, from.length) >= from && local.slice(0, to.length) <= to;
  }
  function pad(n) { var s = String(n); while (s.length < 4) s = '0' + s; return s; }
  function recorded(e) {
    var ty = TYPES[e.type], m = ty && str(e.code) !== null ? /^MSTD-([A-Z]+)-(\d{4,})$/.exec(e.code.trim()) : null;
    return m && m[1] === ty.code ? [m[1], parseInt(m[2], 10)] : null;
  }
  function codesOf(all, byId) {
    var codes = new Map(), taken = {}, top = {};
    all.forEach(function (e) {
      var r = recorded(e);
      if (r) { codes.set(e.id, 'MSTD-' + r[0] + '-' + pad(r[1])); taken[r[0] + ':' + r[1]] = true; }
    });
    all.forEach(function (e) {
      var ty = TYPES[e.type];
      if (!ty) return;
      var k = ty.code;
      if (!has(top, k)) top[k] = 0;
      var r = recorded(e);
      if (r) { top[k] = Math.max(top[k], r[1]); return; }
      var old = isInt(e.replaces) ? e.replaces : null;
      if (old !== null && byId.has(old) && byId.get(old).type === e.type && codes.has(old)) {
        codes.set(e.id, codes.get(old));
        return;
      }
      var n = top[k] + 1;
      while (taken[k + ':' + n]) n++;
      top[k] = n;
      codes.set(e.id, 'MSTD-' + k + '-' + pad(n));
    });
    return codes;
  }

  // O modelo da página: as mesmas seções, grupos e itens da página de hoje.
  function build(raw, computed) {
    var byId = new Map();
    raw.filter(function (e) { return e && isInt(e.id) && typeof e.type === 'string'; })
      .sort(function (a, b) { return a.id - b.id; })
      .forEach(function (e) { if (!byId.has(e.id)) byId.set(e.id, e); });
    var all = Array.from(byId.values());
    var hidden = hiddenOf(all);
    var visible = all.filter(function (e) { return !hidden.has(e.id); });
    var codes = codesOf(all, byId);
    var byCode = new Map();
    visible.forEach(function (e) { if (codes.has(e.id)) byCode.set(codes.get(e.id), e); });
    var waves = (computed && computed.waves) || {}, prompts = (computed && computed.prompts) || {};
    var rtk = arr(computed && computed.rtk);

    if (node.kind === 'table') {
      return h('div', { class: 'table' }, [h('table', null, [
        h('thead', null, [h('tr', null, node.headers.map(function (c) { return h('th', { text: c }); }))]),
        h('tbody', null, node.rows.map(function (r) { return h('tr', null, r.map(function (c) { return h('td', { html: inline(c) }); })); }))])]);
    }
    if (node.kind === 'details') {
      var d = h('details', { class: 'prompt', 'data-owner': node.owner }, [h('summary', { text: node.summary }), h('div', { class: 'md', html: markdown(node.markdown) })]);
      EXTRAS.push({ el: d, owner: node.owner });
      return d;
    }
    if (node.kind === 'overview') {
      var ov = h('div', { class: 'overview' }, [
        h('div', { class: 'ov-head' }, [h('b', { text: node.title }), h('span', { text: node.legend })]),
        node.spend ? h('p', { class: 'ov-spend', text: node.spend }) : null,
        h('ol', { class: 'wgrid' }, node.cards.map(function (c) {
          return h('li', null, [h('a', { class: 'w ' + c.status.tone, href: '#' + c.target, title: c.hint }, [h('b', { text: c.label }), h('span', { text: c.status.label })])]);
        }))]);
      OVERVIEWS.push(ov);
      return ov;
    }
    if (node.kind === 'group') {
      var own = { items: [] }, count = h('span', { class: 'count' });
      var g = h('details', { class: 'group', id: node.anchor, open: node.open }, [
        h('summary', null, [
          h('span', { class: 'gt', text: node.title }),
          h('span', { class: 'gs' }, [node.status ? h('span', { class: 'tag ' + node.status.tone, text: node.status.label }) : null,
            node.summary ? h('span', { html: inline(node.summary) }) : null]),
          count]),
        h('div', { class: 'gbody' }, node.body.map(function (n) { return renderNode(n, own); }))]);
      count.textContent = !node.hideCount && own.items.length ? plural(own.items.length) : '';
      var entry = { el: g, items: own.items, open: node.open };
      GROUPS.push(entry);
      if (ctx) { ctx.items.push.apply(ctx.items, own.items); ctx.groups.push(entry); }
      return g;
    }
    return null;
  }
  function render(model) {
    var open = new Set();
    ITEMS.concat(GROUPS).forEach(function (x) { if (x.el.open && x.el.getAttribute('id')) open.add(x.el.getAttribute('id')); });
    ITEMS = []; EXTRAS = []; GROUPS = []; SECTIONS = []; OVERVIEWS = [];
    KNOWN = model.known;
    MODEL = model;
    D.title = 'Mustard · ' + model.title;
    titleEl.textContent = model.title;
    metaEl.textContent = '';
    model.meta.forEach(function (m) { metaEl.appendChild(h('li', null, [m[0] + ' ', h('b', { text: m[1] })])); });
    box.textContent = '';
    nav.textContent = '';
    model.sections.forEach(function (s) {
      var ctx = { items: [], groups: [] };
      var count = h('span', { class: 'count' });
      var el = h('section', { class: 'block', id: s.anchor }, [h('h2', null, [h('span', { text: s.heading }), count])]);
      s.body.forEach(function (n) { var c = renderNode(n, ctx); if (c) el.appendChild(c); });
      count.textContent = ctx.items.length ? plural(ctx.items.length) : '';
      box.appendChild(el);
      var link = h('li', null, [h('a', { href: '#' + s.anchor }, [h('span', { text: s.heading }), h('i', { text: ctx.items.length ? String(ctx.items.length) : '' })])]);
      nav.appendChild(link);
      SECTIONS.push({ el: el, nav: link, ctx: ctx });
    });
    open.forEach(function (id) {
      ITEMS.concat(GROUPS).forEach(function (x) { if (x.el.getAttribute('id') === id) x.el.open = true; });
    });
    var chosen = kind.value;
    kind.textContent = '';
    kind.appendChild(h('option', { value: '', text: t('page.filter.all') }));
    TYPE_LIST.forEach(function (ty) {
      if (ITEMS.some(function (x) { return x.type === ty.name; })) kind.appendChild(h('option', { value: ty.name, text: t('page.type.' + ty.name) }));
    });
    kind.value = ITEMS.some(function (x) { return x.type === chosen; }) ? chosen : '';
    statusEl.hidden = true;
    RENDERS++;
    app.setAttribute('data-state', 'ready');
    app.setAttribute('data-renders', String(RENDERS));
    apply();
  }
  function noData() {
    emptyState('empty', t('page.no_data'));
  }
  // O documento calculado já tem dado (uma cópia já rodou), mas nenhum item
  // veio da coleção de faixas: o modelo instalado está velho, lendo uma
  // coleção que a cópia de agora não usa mais — dizer isso vale mais do que
  // repetir a linha de banco vazio, que aqui seria falsa.
  function staleTemplate() {
    emptyState('stale', t('page.stale_template'));
  }
  function emptyState(state, message) {
    ITEMS = []; EXTRAS = []; GROUPS = []; SECTIONS = []; OVERVIEWS = []; MODEL = null;
    box.textContent = '';
    nav.textContent = '';
    statusEl.textContent = message;
    statusEl.hidden = false;
    RENDERS++;
    app.setAttribute('data-state', state);
    app.setAttribute('data-renders', String(RENDERS));
  }

  // A busca (por texto, sem acento e sem caixa, ou pelo código de um item) e
  // o filtro por tipo valem juntos.
  function apply() {
    var terms = fold(q.value.trim()).split(/\s+/).filter(Boolean), type = kind.value, active = terms.length > 0 || !!type;
    var owners = null;
    if (terms.length === 1 && /[a-z]-\d/.test(terms[0])) {
      owners = ITEMS.filter(function (x) { return x.code === terms[0] || x.code.slice(-terms[0].length - 1) === '-' + terms[0]; });
      if (!owners.length) owners = null;
    }
    var found = 0;
    ITEMS.forEach(function (x) {
      var ok = !type || x.type === type;
      if (ok && terms.length) ok = owners ? owners.indexOf(x) >= 0 : terms.every(function (w) { return x.text.indexOf(w) >= 0; });
      x.el.hidden = !ok;
      if (ok) found++;
    });
    var shownCodes = new Set(ITEMS.filter(function (x) { return !x.el.hidden; }).map(function (x) { return x.el.getAttribute('data-code'); }));
    EXTRAS.forEach(function (x) { x.el.hidden = active && !(x.owner && shownCodes.has(x.owner)); });
    GROUPS.forEach(function (g) {
      var any = g.items.some(function (x) { return !x.el.hidden; });
      g.el.hidden = active && !any;
      if (active) g.el.open = any; else g.el.open = g.el.open || g.open;
    });
    SECTIONS.forEach(function (s) {
      var any = s.ctx.items.some(function (x) { return !x.el.hidden; });
      s.el.hidden = active && !any;
      s.nav.hidden = active && !any;
    });
    OVERVIEWS.forEach(function (o) { o.hidden = active; });
    hits.textContent = active ? plural(found) : '';
    notFound.hidden = !active || found > 0 || !MODEL;
  }
  q.addEventListener('input', apply);
  kind.addEventListener('change', apply);
  openAll.addEventListener('click', function () {
    GROUPS.forEach(function (g) { if (!g.el.hidden) g.el.open = true; });
    ITEMS.forEach(function (x) { if (!x.el.hidden) x.el.open = true; });
  });
  closeAll.addEventListener('click', function () {
    ITEMS.forEach(function (x) { x.el.open = false; });
    GROUPS.forEach(function (g) { g.el.open = false; });
  });
  menu.addEventListener('click', function () { D.body.classList.toggle('nav-open'); });
  app.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    var el = a ? D.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))) : null;
    if (!el) return;
    ev.preventDefault();
    for (var p = el; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
    if (el.scrollIntoView) el.scrollIntoView({ block: 'start' });
    D.body.classList.remove('nav-open');
  });
  // O botão só aparece com o salvar arquivo do claude.ai (`downloads`)
  // disponível: sem ele, baixar direto pelo navegador não funciona dentro
  // do claude.ai, então o botão some em vez de tentar.
  var hasDownloads = W.claude && typeof W.claude.use === 'function' ? W.claude.use('downloads') : Promise.resolve(null);
  Promise.resolve(hasDownloads).then(function (dl) { download.hidden = !dl; }, function () { download.hidden = true; });
  download.addEventListener('click', function () {
    if (!MODEL) return Promise.resolve();
    var text = toMarkdown(MODEL), name = (MODEL.spec || 'spec') + '.md';
    var ask = W.claude && typeof W.claude.use === 'function' ? W.claude.use('downloads') : Promise.resolve(null);
    return Promise.resolve(ask).then(function (dl) {
      if (dl) return dl.save({ filename: name, data: text }).catch(function () { return null; });
      return null;
    }, function () { return null; });
  });

  // ---------------------------------------------------------------------
  // O banco: as faixas de itens em páginas, em ordem de início (e de
  // pedaço, dentro da mesma faixa), e o documento das coisas calculadas.
  // Uma cópia nova (uma faixa nova ou trocada, ou o documento das coisas
  // calculadas) faz a página ler de novo.
  // ---------------------------------------------------------------------
  var SEEN = { top: null, computed: null };
  // O primeiro pedaço de cada faixa (seq = início * 1000) leva `chunks`,
  // quantos pedaços ela tem agora. Um pedaço velho, que sobrou depois de a
  // faixa encolher (um expurgo, por exemplo), continua no banco sem ninguém
  // apagar; esta conta é por onde a leitura sabe até qual pedaço ler,
  // ignorando o que sobrou, sem repetir item.
  function readItems(db) {
    var out = [];
    var expect = {};
    function page(after) {
      return db.collection(DBP.ranges).where('seq', '>', after).orderBy('seq').limit(PAGE).get().then(function (snap) {
        var last = null;
        snap.docs.forEach(function (d) {
          var b = d.data();
          if (!b || !isInt(b.seq)) return;
          var start = Math.floor(b.seq / 1000);
          var n = b.seq - start * 1000;
          if (n === 0) expect[start] = isInt(b.chunks) ? b.chunks : 1;
          if (n < (expect[start] === undefined ? 1 : expect[start])) {
            (b.items || []).forEach(function (item) { out.push(item); });
          }
          last = b;
        });
        if (snap.docs.length < PAGE || !last || !isInt(last.seq) || last.seq <= after) return out;
        return page(last.seq);
      });
    }
    return page(-1);
  }
  function readComputed(db) {
    return db.doc(DBP.computed).get().then(function (s) { return (s && s.exists && s.data()) || {}; });
  }
  function reload(db) {
    return Promise.all([readItems(db), readComputed(db)]).then(function (got) {
      SEEN.computed = JSON.stringify(got[1]);
      if (!got[0].length) {
        SEEN.top = null;
        // Um documento calculado com dado é a marca de que uma cópia já
        // rodou; sem nenhum item na coleção de faixas mesmo assim, a coleção
        // que o modelo lê não é a que a cópia de agora escreve.
        var copied = got[1] && (isInt(got[1].last) || typeof got[1].spec === 'string');
        if (copied) staleTemplate(); else noData();
        return;
      }
      var model = build(got[0], got[1]);
      SEEN.top = model.top;
      render(model);
    }, function () { if (!MODEL) noData(); });
  }
  function watch(db) {
    var timer = 0;
    function later() { clearTimeout(timer); timer = setTimeout(function () { reload(db); }, 600); }
    function failed() { statusEl.textContent = t('page.watch_failed'); statusEl.hidden = false; }
    db.doc(DBP.computed).onSnapshot(function (s) {
      if (JSON.stringify((s && s.exists && s.data()) || {}) !== SEEN.computed) later();
    }, failed);
    db.collection(DBP.ranges).orderBy('seq', 'desc').limit(1).onSnapshot(function (s) {
      var d = s.docs[0], b = d && d.data();
      var items = (b && b.items) || [];
      var top = items.length ? items[items.length - 1] : null;
      if ((top && isInt(top.id) ? top.id : null) !== SEEN.top) later();
    }, failed);
  }
  var ready = W.claude && typeof W.claude.use === 'function' ? W.claude.use('db') : Promise.resolve(null);
  Promise.resolve(ready).then(function (db) {
    if (!db) { noData(); return; }
    return reload(db).then(function () { watch(db); });
  }, noData);
})();
</script>
</body>
</html>
